            data:
              type: announce
              method: spoken
            message: "{{ states('input_text.frigo_messaggio') }} in {{ state_attr('sensor.time_on_frigo','tempo_ciclo_frigo') }}"

    - choose:
      - conditions:
        - condition: trigger
          id: fine_ciclo
