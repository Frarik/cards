homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: 'Frarik Montalatte 10'
        author: 'Frarik'
        reference: 'github.com/Frarik/cards'
      setting:

####################################################
#                                                  #
#              IMPOSTAZIONI PACKAGE                #
#                                                  #
####################################################

        Sensore Consumo Elettrodomestici: &sensore_consumo_montalatte "{{ states('IL_TUO_SENSORE_POTENZA') | float(0) }}"
        Switch Power Elettrodomestici: &switch_montalatte 'IL_TUO_SWITCH'

        Lista MediaPlayer Google: &google
          - IL_TUO_MEDIA_PLAYER_GOOGLE

        Lista mediaplayer alexa: &alexa
          - IL_TUO_MEDIA_PLAYER_ALEXA

        Device per notifica push: &push
          - service: IL_TUO_MOBILE_APP

####################################################
#                                                  #
#              NOTIFICHE GRUPPO                    #
#                                                  #
####################################################

notify:
  - name: Frarik Montalatte
    platform: group
    services: *push

####################################################
#                                                  #
#                    SENSORI                       #
#                                                  #
####################################################

sensor:
  - platform: integration
    source: sensor.frarik_montalatte_potenza_w
    name: frarik_montalatte_kwh
    unit_prefix: k
    method: left
    round: 2

####################################################
#                                                  #
#                INPUT NUMBER                      #
#                                                  #
####################################################

input_number:
  frarik_montalatte_soglia_lavoro_w:
    name: Soglia Lavoro Elettrodomestici W
    icon: mdi:flash
    min: 0
    max: 5000
    step: 1.00
    unit_of_measurement: "w"
    mode: box

  frarik_montalatte_tempo_innesco_m:
    name: Tempo Innesco Elettrodomestici M
    icon: mdi:flash
    min: 0
    max: 60
    step: 1.00
    unit_of_measurement: "m"
    mode: box

  frarik_montalatte_avvio_ritardato_s:
    name: Avvio Ritardato Conteggio Elettrodomestici S
    icon: mdi:flash
    min: 0
    max: 60
    step: 1.00
    unit_of_measurement: "s"
    mode: box

####################################################

  frarik_montalatte_lunedi_consumo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_montalatte_lunedi_costo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################

  frarik_montalatte_martedi_consumo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_montalatte_martedi_costo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################

  frarik_montalatte_mercoledi_consumo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_montalatte_mercoledi_costo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################

  frarik_montalatte_giovedi_consumo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_montalatte_giovedi_costo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################

  frarik_montalatte_venerdi_consumo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_montalatte_venerdi_costo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################

  frarik_montalatte_sabato_consumo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_montalatte_sabato_costo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################

  frarik_montalatte_domenica_consumo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_montalatte_domenica_costo:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################
#                                                  #
#                 UTILITY METER                    #
#                                                  #
####################################################

utility_meter:

# Tempo

  frarik_montalatte_tempo_oggi:
    source: sensor.frarik_montalatte_time_on
    cycle: daily

  frarik_montalatte_tempo_mese:
    source: sensor.frarik_montalatte_time_on
    cycle: monthly

  frarik_montalatte_tempo_anno:
    source: sensor.frarik_montalatte_time_on
    cycle: yearly

####################################################

# Cicli

  frarik_montalatte_cicli_oggi:
    source: counter.frarik_montalatte_cicli_totale
    cycle: daily

  frarik_montalatte_cicli_mese:
    source: counter.frarik_montalatte_cicli_totale
    cycle: monthly

  frarik_montalatte_cicli_anno:
    source: counter.frarik_montalatte_cicli_totale
    cycle: yearly

####################################################

# Consumi KWh

  frarik_montalatte_energy_oggi:
    source: sensor.frarik_montalatte_kwh
    cycle: daily

  frarik_montalatte_energy_mese:
    source: sensor.frarik_montalatte_kwh
    cycle: monthly

  frarik_montalatte_energy_anno:
    source: sensor.frarik_montalatte_kwh
    cycle: yearly

####################################################
#                                                  #
#                TEMPLATE                          #
#                                                  #
####################################################

template:
  - binary_sensor:
      - name: frarik_montalatte_ac
        icon: mdi:state-machine
        state: "{{ 'on' if (states('sensor.frarik_montalatte_potenza_w') | int(0) ) > states('input_number.frarik_montalatte_soglia_lavoro_w')|int(0) else 'off' }}"
        delay_off: "00:{{ states('input_number.frarik_montalatte_tempo_innesco_m')|int(0) }}:00"
        delay_on: "00:00:{{ states('input_number.frarik_montalatte_avvio_ritardato_s')|int(0) }}"

####################################################

  - trigger:
      - platform: state
        entity_id: input_boolean.frarik_montalatte_durata_ciclo_attivo
        from: "off"
        to: "on"
    sensor:
      - name: frarik_montalatte_inizio_ciclo
        state: "{{states('sensor.frarik_montalatte_kwh')}}"

  - trigger:
      - platform: state
        entity_id: binary_sensor.frarik_montalatte_ac
        from: "on"
        to: "off"
    sensor:
      - name: frarik_montalatte_fine_ciclo
        state: "{{now().strftime('%d/%m/%Y %H:%M')}}"

####################################################

  - trigger:
      - platform: state
        entity_id: input_boolean.frarik_montalatte_durata_ciclo_attivo
        from: 'off'
        to: "on"
    sensor:
      - name: frarik_montalatte_tempo_riavvio
        state: "{{as_timestamp(now())}}"

####################################################

  - sensor:
      - name: "frarik_montalatte_time_on"
        icon: mdi:history
        state: >-
          {%if is_state('binary_sensor.frarik_montalatte_ac', 'on') and (as_timestamp(states.binary_sensor.frarik_montalatte_ac.last_changed)+1) <= as_timestamp(now())%}
            {{((as_timestamp(now()) - as_timestamp(states.binary_sensor.frarik_montalatte_ac.last_changed))/3600)}}
          {% else %} 0 {% endif %}
        attributes:
          terminato: "{{ states('sensor.frarik_montalatte_fine_ciclo') if is_state('binary_sensor.frarik_montalatte_ac', 'off') else 'In funzione' }}"
          frarik_montalatte_tempo_ciclo: >
            {%set hours =(as_timestamp(now()) - states('sensor.frarik_montalatte_tempo_riavvio')|float(0))/3600 %}
            {% set minutes = ((hours % 1) * 60) | int (0)%}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {%set day = ((hours |int(0) /24))|int(0) %}
            {%if is_state('input_boolean.frarik_montalatte_durata_ciclo_attivo', 'on')%}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int(0))-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
            {%else%}
            {{states('input_text.frarik_montalatte_ultimo_ciclo')}}
            {%endif%}
          Oggi: >
            {% set hours = states('sensor.frarik_montalatte_tempo_oggi') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
              {% if hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Mese: >
            {% set hours = states('sensor.frarik_montalatte_tempo_mese') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours |int /24))|int(0) %}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int)-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Anno: >
            {% set hours = states('sensor.frarik_montalatte_tempo_anno') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours |int(0) /24))|int(0) %}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int(0))-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Ieri: >
            {% set hours = state_attr('sensor.frarik_montalatte_tempo_oggi', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
              {% if hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Mese Precedente: >
            {% set hours = state_attr('sensor.frarik_montalatte_tempo_mese', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours |int /24))|int(0) %}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int)-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Anno Precedente: >
            {% set hours = state_attr('sensor.frarik_montalatte_tempo_anno', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours |int(0) /24))|int(0) %}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int(0))-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}

          frarik_montalatte_consumo_ciclo: "{{(states('sensor.frarik_montalatte_kwh')|float(0)-states('sensor.frarik_montalatte_inizio_ciclo')|float(0))|round(2)}} kWh"
          frarik_montalatte_costo_ciclo: "{{((states('sensor.frarik_montalatte_kwh')|float(0)-states('sensor.frarik_montalatte_inizio_ciclo')|float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"

          frarik_montalatte_costo_giornaliero: "{{((states('sensor.frarik_montalatte_energy_oggi') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          frarik_montalatte_costo_mensile: "{{((states('sensor.frarik_montalatte_energy_mese') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          frarik_montalatte_costo_annuale: "{{((states('sensor.frarik_montalatte_energy_anno') | float(0)) * (states('input_number.costo_energia') | float(0))) | round(2, default=0) }}"

          frarik_montalatte_costo_ieri: "{{((state_attr('sensor.frarik_montalatte_energy_oggi', 'last_period') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          frarik_montalatte_costo_mese_precedente: "{{((state_attr('sensor.frarik_montalatte_energy_mese', 'last_period') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          frarik_montalatte_costo_anno_precedente: "{{((state_attr('sensor.frarik_montalatte_energy_anno', 'last_period') | float(0)) * (states('input_number.costo_energia') | float(0))) | round(2, default=0) }}"

  - sensor:
      - name: "frarik_montalatte_potenza_w"
        unit_of_measurement: 'W'
        device_class: power
        state_class: measurement
        icon: mdi:flash
        state: *sensore_consumo_montalatte

      - name: "frarik_montalatte_versione"
        state: "10"

####################################################
#                                                  #
#                CUONTER                           #
#                                                  #
####################################################

counter:
  frarik_montalatte_cicli_totale:
    name: Cicli Funzionamento Elettrodomestici Totale
    initial: 0
    step: 1

####################################################
#                                                  #
#                INPUT BOOLEAN                     #
#                                                  #
####################################################

input_boolean:
  frarik_montalatte_switch:
    name: Switch Elettrodomestici
    icon: mdi:flash

####################################################

  frarik_montalatte_durata_ciclo_attivo:
    name: Ciclo Attivo Elettrodomestici

####################################################

  frarik_montalatte_notify_push:
    name: Notifica Push

####################################################

  frarik_montalatte_notify_alexa:
    name: Notifica Alexa

####################################################

  frarik_montalatte_notify_google:
    name: Notifica Google

####################################################
#                                                  #
#                      GROUP                       #
#                                                  #
####################################################

group:
 frarik_montalatte_notifiche:
  entities:
    - input_boolean.frarik_montalatte_notify_google
    - input_boolean.frarik_montalatte_notify_alexa
    - input_boolean.frarik_montalatte_notify_push
    - automation.frarik_montalatte_off_automatico
    - input_boolean.frarik_montalatte_switch

####################################################
#                                                  #
#                  INPUT DATETIME                  #
#                                                  #
####################################################

input_datetime:

  orario_inizio_frarik_montalatte_notifiche:
    name: Orario Inizio Notifiche Elettrodomestici
    has_date: false
    has_time: true

  ####################################################

  orario_fine_frarik_montalatte_notifiche:
    name: Orario Fine Notifiche Elettrodomestici
    has_date: false
    has_time: true

  ####################################################

  frarik_montalatte_off:
    name: Elettrodomestici Off
    has_date: false
    has_time: true

####################################################
#                                                  #
#                  INPUT TEXT                      #
#                                                  #
####################################################

input_text:
  frarik_montalatte_data_reset:

####################################################

  frarik_montalatte_nome:

####################################################

  frarik_montalatte_messaggio:

####################################################

  frarik_montalatte_ultimo_ciclo:

####################################################
####################################################

  frarik_montalatte_lunedi_cicli:
  frarik_montalatte_lunedi_tempo:

####################################################

  frarik_montalatte_martedi_cicli:
  frarik_montalatte_martedi_tempo:

####################################################

  frarik_montalatte_mercoledi_cicli:
  frarik_montalatte_mercoledi_tempo:

####################################################

  frarik_montalatte_giovedi_cicli:
  frarik_montalatte_giovedi_tempo:

####################################################

  frarik_montalatte_venerdi_cicli:
  frarik_montalatte_venerdi_tempo:

####################################################

  frarik_montalatte_sabato_cicli:
  frarik_montalatte_sabato_tempo:

####################################################

  frarik_montalatte_domenica_cicli:
  frarik_montalatte_domenica_tempo:

####################################################
#                                                  #
#                        SCRIPT                    #
#                                                  #
####################################################

script:
  frarik_montalatte_reset_sensori:
    sequence:
    - service: input_text.set_value
      data:
        value: >-
          {{now().strftime('%d/%m/%Y %H:%M')}}
      target:
        entity_id: input_text.frarik_montalatte_data_reset
    - service: utility_meter.calibrate
      data:
        value: '0'
      target:
        entity_id:
          - sensor.frarik_montalatte_cicli_oggi
          - sensor.frarik_montalatte_cicli_mese
          - sensor.frarik_montalatte_cicli_anno
          - sensor.frarik_montalatte_energy_oggi
          - sensor.frarik_montalatte_energy_mese
          - sensor.frarik_montalatte_energy_anno
          - sensor.frarik_montalatte_tempo_oggi
          - sensor.frarik_montalatte_tempo_mese
          - sensor.frarik_montalatte_tempo_anno


    - service: input_number.set_value
      data:
        value: '0'
      target:
        entity_id:
          - input_number.frarik_montalatte_lunedi_consumo
          - input_number.frarik_montalatte_martedi_consumo
          - input_number.frarik_montalatte_mercoledi_consumo
          - input_number.frarik_montalatte_giovedi_consumo
          - input_number.frarik_montalatte_venerdi_consumo
          - input_number.frarik_montalatte_sabato_consumo
          - input_number.frarik_montalatte_domenica_consumo
          - input_number.frarik_montalatte_lunedi_costo
          - input_number.frarik_montalatte_martedi_costo
          - input_number.frarik_montalatte_mercoledi_costo
          - input_number.frarik_montalatte_giovedi_costo
          - input_number.frarik_montalatte_venerdi_costo
          - input_number.frarik_montalatte_sabato_costo
          - input_number.frarik_montalatte_domenica_costo

    - service: input_text.set_value
      data:
        value: '0'
      target:
        entity_id:
          - input_text.frarik_montalatte_lunedi_cicli
          - input_text.frarik_montalatte_martedi_cicli
          - input_text.frarik_montalatte_mercoledi_cicli
          - input_text.frarik_montalatte_giovedi_cicli
          - input_text.frarik_montalatte_venerdi_cicli
          - input_text.frarik_montalatte_sabato_cicli
          - input_text.frarik_montalatte_domenica_cicli
          - input_text.frarik_montalatte_lunedi_tempo
          - input_text.frarik_montalatte_martedi_tempo
          - input_text.frarik_montalatte_mercoledi_tempo
          - input_text.frarik_montalatte_giovedi_tempo
          - input_text.frarik_montalatte_venerdi_tempo
          - input_text.frarik_montalatte_sabato_tempo
          - input_text.frarik_montalatte_domenica_tempo

    - service: counter.reset
      target:
        entity_id:
          - counter.frarik_montalatte_cicli_totale

####################################################
#                                                  #
#                      AUTOMAZIONI                 #
#                                                  #
####################################################

automation:
- alias: Frarik Montalatte
  id: frarik_montalatte
  max_exceeded: silent
  trigger:

  - platform: state
    entity_id: binary_sensor.frarik_montalatte_ac
    from: 'off'
    to: 'on'
    id: inizio_ciclo

  - platform: state
    entity_id: binary_sensor.frarik_montalatte_ac
    from: 'on'
    to: 'off'
    id: fine_ciclo

  - platform: time
    at: '23:59:59'
    id: incremento_sensori_7_giorni_elettrodomestici

  - platform: state
    entity_id:
      - input_boolean.frarik_montalatte_switch
      - *switch_montalatte
    from: 'on'
    to: 'off'
    id: switch_off

  - platform: state
    entity_id:
      - input_boolean.frarik_montalatte_switch
      - *switch_montalatte
    from: 'off'
    to: 'on'
    id: switch_on

  - platform: template
    value_template: "{{ is_state('binary_sensor.frarik_montalatte_ac','off') and is_state('input_boolean.frarik_montalatte_durata_ciclo_attivo','on') }}"
    id: controllo_ciclo

  action:

####################################################
# Incremento 7 Giorni Statistiche

  - choose:
    - conditions:
      - condition: trigger
        id: incremento_sensori_7_giorni_elettrodomestici
      sequence:

# Cicli
      - service: input_text.set_value
        target:
          entity_id: >
            {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
            {% if (today in ["Monday"]) %} input_text.frarik_montalatte_lunedi_cicli
            {% elif (today in ["Tuesday"]) %} input_text.frarik_montalatte_martedi_cicli
            {% elif (today in ["Wednesday"]) %} input_text.frarik_montalatte_mercoledi_cicli
            {% elif (today in ["Thursday"]) %} input_text.frarik_montalatte_giovedi_cicli
            {% elif (today in ["Friday"]) %} input_text.frarik_montalatte_venerdi_cicli
            {% elif (today in ["Saturday"]) %} input_text.frarik_montalatte_sabato_cicli
            {% elif (today in ["Sunday"]) %} input_text.frarik_montalatte_domenica_cicli
            {% endif %}
        data:
          value: "{{states('sensor.frarik_montalatte_cicli_oggi')}}"

# Tempo
      - service: input_text.set_value
        target:
          entity_id: >
            {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
            {% if (today in ["Monday"]) %} input_text.frarik_montalatte_lunedi_tempo
            {% elif (today in ["Tuesday"]) %} input_text.frarik_montalatte_martedi_tempo
            {% elif (today in ["Wednesday"]) %} input_text.frarik_montalatte_mercoledi_tempo
            {% elif (today in ["Thursday"]) %} input_text.frarik_montalatte_giovedi_tempo
            {% elif (today in ["Friday"]) %} input_text.frarik_montalatte_venerdi_tempo
            {% elif (today in ["Saturday"]) %} input_text.frarik_montalatte_sabato_tempo
            {% elif (today in ["Sunday"]) %} input_text.frarik_montalatte_domenica_tempo
            {% endif %}
        data:
          value: "{{state_attr('sensor.frarik_montalatte_time_on','Oggi')}}"

# Consumo
      - service: input_number.set_value
        target:
          entity_id: >
            {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
            {% if (today in ["Monday"]) %} input_number.frarik_montalatte_lunedi_consumo
            {% elif (today in ["Tuesday"]) %} input_number.frarik_montalatte_martedi_consumo
            {% elif (today in ["Wednesday"]) %} input_number.frarik_montalatte_mercoledi_consumo
            {% elif (today in ["Thursday"]) %} input_number.frarik_montalatte_giovedi_consumo
            {% elif (today in ["Friday"]) %} input_number.frarik_montalatte_venerdi_consumo
            {% elif (today in ["Saturday"]) %} input_number.frarik_montalatte_sabato_consumo
            {% elif (today in ["Sunday"]) %} input_number.frarik_montalatte_domenica_consumo
            {% endif %}
        data:
          value: "{{states('sensor.frarik_montalatte_energy_oggi')}}"

# Costi
      - service: input_number.set_value
        target:
          entity_id: >
            {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
            {% if (today in ["Monday"]) %} input_number.frarik_montalatte_lunedi_costo
            {% elif (today in ["Tuesday"]) %} input_number.frarik_montalatte_martedi_costo
            {% elif (today in ["Wednesday"]) %} input_number.frarik_montalatte_mercoledi_costo
            {% elif (today in ["Thursday"]) %} input_number.frarik_montalatte_giovedi_costo
            {% elif (today in ["Friday"]) %} input_number.frarik_montalatte_venerdi_costo
            {% elif (today in ["Saturday"]) %} input_number.frarik_montalatte_sabato_costo
            {% elif (today in ["Sunday"]) %} input_number.frarik_montalatte_domenica_costo
            {% endif %}
        data:
          value: "{{state_attr('sensor.frarik_montalatte_time_on','frarik_montalatte_costo_giornaliero')}}"

####################################################
# Switch & Boolean OFF

  - choose:
    - alias: SWITCH E BOOLEAN OFF
      conditions:
      - condition: trigger
        id: switch_off
      sequence:
      - service: switch.turn_off
        target:
          entity_id: *switch_montalatte
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.frarik_montalatte_switch

####################################################
# Switch & Boolean ON

  - choose:
    - alias: SWITCH E BOOLEAN ON
      conditions:
      - condition: trigger
        id: switch_on
      sequence:
      - service: switch.turn_on
        target:
          entity_id: *switch_montalatte
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.frarik_montalatte_switch

####################################################
# Controllo Ciclo

  - choose:
    - conditions:
      - condition: trigger
        id: controllo_ciclo
      sequence:
      - delay: '00:01:00'
      - entity_id: input_boolean.frarik_montalatte_durata_ciclo_attivo
        service: input_boolean.turn_off

####################################################
# Inizio Ciclo

  - choose:
    - conditions:
      - condition: trigger
        id: inizio_ciclo
      sequence:
      - entity_id: input_boolean.frarik_montalatte_durata_ciclo_attivo
        service: input_boolean.turn_on

####################################################
# Fine Ciclo

  - choose:
    - conditions:
      - condition: trigger
        id: fine_ciclo
      sequence:

      - service: input_text.set_value
        target:
          entity_id: input_text.frarik_montalatte_ultimo_ciclo
        data:
          value: >-
            {{state_attr('sensor.frarik_montalatte_time_on','frarik_montalatte_tempo_ciclo')}}

      - service: counter.increment
        target:
          entity_id:
            - counter.frarik_montalatte_cicli_totale

      - delay: '00:00:05'

      - entity_id: input_boolean.frarik_montalatte_durata_ciclo_attivo
        service: input_boolean.turn_off

  ####################################################
  # Fine Ciclo GOOGLE

  - parallel:
    - choose:
      - conditions:
        - condition: trigger
          id: fine_ciclo
        - condition: time
          after: 'input_datetime.orario_inizio_frarik_montalatte_notifiche'
          before: 'input_datetime.orario_fine_frarik_montalatte_notifiche'
        - condition: state
          entity_id: input_boolean.frarik_montalatte_notify_google
          state: 'on'
        sequence:
        - service: tts.google_translate_say
          continue_on_error: true
          data:
            entity_id: *google
            message: "{{states('input_text.frarik_montalatte_messaggio')}} in {{state_attr('sensor.frarik_montalatte_time_on','frarik_montalatte_tempo_ciclo')}}"

  ####################################################
  # Fine Ciclo ALEXA

    - choose:
      - conditions:
        - condition: trigger
          id: fine_ciclo
        - condition: time
          after: 'input_datetime.orario_inizio_frarik_montalatte_notifiche'
          before: 'input_datetime.orario_fine_frarik_montalatte_notifiche'
        - condition: state
          entity_id: input_boolean.frarik_montalatte_notify_alexa
          state: 'on'
        sequence:
        - service: notify.alexa_media
          continue_on_error: true
          data:
            target: *alexa
            data:
              type: announce
              method: spoken
            message: "{{states('input_text.frarik_montalatte_messaggio')}} in {{state_attr('sensor.frarik_montalatte_time_on','frarik_montalatte_tempo_ciclo')}}"

  ####################################################
  # Fine Ciclo CELLULARE

    - choose:
      - conditions:
        - condition: trigger
          id: fine_ciclo
        - condition: state
          entity_id: input_boolean.frarik_montalatte_notify_push
          state: 'on'
        sequence:
        - data_template:
            message: >-
              📌 {{states('input_text.frarik_montalatte_messaggio')}}

              ⏱ {{state_attr('sensor.frarik_montalatte_time_on','frarik_montalatte_tempo_ciclo')}}

              ⚡️ Consumati: {{state_attr('sensor.frarik_montalatte_time_on','frarik_montalatte_consumo_ciclo')}}

              💰 Spesi: {{state_attr('sensor.frarik_montalatte_time_on','frarik_montalatte_costo_ciclo')}} €
            title: "{{states('input_text.frarik_montalatte_nome')}}"
          service: notify.frarik_montalatte
          continue_on_error: true

