#                                                             #
#   ███████╗██████╗  █████╗ ██████╗ ██╗██╗  ██╗             #
#   ██╔════╝██╔══██╗██╔══██╗██╔══██╗██║██║ ██╔╝             #
#   █████╗  ██████╔╝███████║██████╔╝██║█████╔╝              #
#   ██╔══╝  ██╔══██╗██╔══██║██╔══██╗██║██╔═██╗              #
#   ██║     ██║  ██║██║  ██║██║  ██║██║██║  ██╗             #
#   ╚═╝     ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝╚═╝  ╚═╝            #
#                                                             #
#   Package: Frarik — Centro Controllo Asciugatrice        #
#   Versione: 2.0  |  Frarik / Fratech                       #
#                                                             #
###############################################################
#
# COSA FA QUESTO PACKAGE
# ──────────────────────────────────────────────────────────
#  ▸ Monitoraggio potenza istantanea (W) e rilevamento ciclo
#  ▸ Tracciamento energia consumata (kWh) giorno/mese/anno
#  ▸ Calcolo costi energetici (usa input_number.costo_energia)
#  ▸ Conteggio cicli oggi/mese/anno e storico 7 giorni
#  ▸ Durata ciclo live e storico con statistiche settimanali
#  ▸ Notifiche fine ciclo: Push / Alexa / Google (orario custom)
#  ▸ Spegnimento automatico programmato
#
###############################################################
#
# INSTALLAZIONE TRAMITE STORE FRARIK
# ──────────────────────────────────────────────────────────
#  Il wizard sostituisce automaticamente i segnaposto IL_TUO_*
#  con le entita' che inserisci durante la configurazione.
#
# INSTALLAZIONE MANUALE
# ──────────────────────────────────────────────────────────
#  1. configuration.yaml deve contenere:
#        homeassistant:
#          packages: !include_dir_named packages
#  2. Copia in packages/frarik/
#  3. Sostituisci i segnaposto IL_TUO_* con le tue entita'
#  4. Riavvia Home Assistant
#
###############################################################

homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: 'Frarik — Centro Controllo Asciugatrice 2.0 — Frarik'
      setting:

####################################################
#              IMPOSTAZIONI PACKAGE                #
####################################################

        Sensore Potenza Asciugatrice: &sensore_potenza   "IL_TUO_SENSORE_POTENZA"
        Switch Asciugatrice:          &switch_asciugatrice   "IL_TUO_SWITCH"

        Lista MediaPlayer Google: &google
          - IL_TUO_MEDIA_PLAYER_GOOGLE

        Lista MediaPlayer Alexa: &alexa
          - IL_TUO_MEDIA_PLAYER_ALEXA

        Device per notifica push: &push
          - service: IL_TUO_MOBILE_APP

####################################################
#                  NOTIFICHE                       #
####################################################

notify:
  - name: frarik_asciugatrice_notify
    platform: group
    services: *push

####################################################
#                    SENSORI                       #
####################################################

sensor:
  - platform: integration
    source: sensor.frarik_asciugatrice_potenza_w
    name: frarik_asciugatrice_kwh
    unit_prefix: k
    method: left
    round: 2

####################################################
#                 INPUT NUMBER                     #
####################################################

input_number:

  frarik_asciugatrice_soglia_w:
    name: Soglia Lavoro Asciugatrice W
    icon: mdi:flash
    min: 0
    max: 5000
    step: 1.00
    unit_of_measurement: "w"
    mode: box

  frarik_asciugatrice_tempo_innesco_m:
    name: Tempo Innesco Asciugatrice M
    icon: mdi:timer
    min: 0
    max: 60
    step: 1.00
    unit_of_measurement: "m"
    mode: box

  frarik_asciugatrice_avvio_ritardato_s:
    name: Avvio Ritardato Asciugatrice S
    icon: mdi:timer-sand
    min: 0
    max: 60
    step: 1.00
    unit_of_measurement: "s"
    mode: box

####################################################

  frarik_asciugatrice_consumo_lunedi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_asciugatrice_costo_lunedi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  frarik_asciugatrice_consumo_martedi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_asciugatrice_costo_martedi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  frarik_asciugatrice_consumo_mercoledi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_asciugatrice_costo_mercoledi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  frarik_asciugatrice_consumo_giovedi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_asciugatrice_costo_giovedi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  frarik_asciugatrice_consumo_venerdi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_asciugatrice_costo_venerdi:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  frarik_asciugatrice_consumo_sabato:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_asciugatrice_costo_sabato:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  frarik_asciugatrice_consumo_domenica:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  frarik_asciugatrice_costo_domenica:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################
#                 UTILITY METER                    #
####################################################

utility_meter:

  frarik_asciugatrice_tempo_oggi:
    source: sensor.frarik_asciugatrice_time_on
    cycle: daily

  frarik_asciugatrice_tempo_mese:
    source: sensor.frarik_asciugatrice_time_on
    cycle: monthly

  frarik_asciugatrice_tempo_anno:
    source: sensor.frarik_asciugatrice_time_on
    cycle: yearly

  frarik_asciugatrice_cicli_oggi:
    source: counter.frarik_asciugatrice_cicli_totale
    cycle: daily

  frarik_asciugatrice_cicli_mese:
    source: counter.frarik_asciugatrice_cicli_totale
    cycle: monthly

  frarik_asciugatrice_cicli_anno:
    source: counter.frarik_asciugatrice_cicli_totale
    cycle: yearly

  frarik_asciugatrice_energy_oggi:
    source: sensor.frarik_asciugatrice_kwh
    cycle: daily

  frarik_asciugatrice_energy_mese:
    source: sensor.frarik_asciugatrice_kwh
    cycle: monthly

  frarik_asciugatrice_energy_anno:
    source: sensor.frarik_asciugatrice_kwh
    cycle: yearly

####################################################
#                   TEMPLATE                       #
####################################################

template:

  - binary_sensor:
      - name: frarik_asciugatrice_motore
        icon: mdi:tumble-dryer
        state: >-
          {{ 'on' if (states('sensor.frarik_asciugatrice_potenza_w') | int(0)) >
             states('input_number.frarik_asciugatrice_soglia_w') | int(0) else 'off' }}
        delay_off: "00:{{ states('input_number.frarik_asciugatrice_tempo_innesco_m') | int(0) }}:00"
        delay_on:  "00:00:{{ states('input_number.frarik_asciugatrice_avvio_ritardato_s') | int(0) }}"

####################################################

  - trigger:
      - platform: state
        entity_id: input_boolean.frarik_asciugatrice_ciclo_attivo
        from: "off"
        to: "on"
    sensor:
      - name: frarik_asciugatrice_inizio_ciclo
        state: "{{ states('sensor.frarik_asciugatrice_kwh') }}"

  - trigger:
      - platform: state
        entity_id: binary_sensor.frarik_asciugatrice_motore
        from: "on"
        to: "off"
    sensor:
      - name: frarik_asciugatrice_fine_ciclo
        state: "{{ now().strftime('%d/%m/%Y %H:%M') }}"

####################################################

  - trigger:
      - platform: state
        entity_id: input_boolean.frarik_asciugatrice_ciclo_attivo
        from: "off"
        to: "on"
    sensor:
      - name: frarik_asciugatrice_tempo_riavvio
        state: "{{ as_timestamp(now()) }}"

####################################################

  - sensor:
      - name: frarik_asciugatrice_time_on
        icon: mdi:history
        state: >-
          {% if is_state('binary_sensor.frarik_asciugatrice_motore', 'on') and
                (as_timestamp(states.binary_sensor.frarik_asciugatrice_motore.last_changed) + 1) <= as_timestamp(now()) %}
            {{ ((as_timestamp(now()) - as_timestamp(states.binary_sensor.frarik_asciugatrice_motore.last_changed)) / 3600) }}
          {% else %} 0 {% endif %}
        attributes:
          terminato: >-
            {{ states('sensor.frarik_asciugatrice_fine_ciclo') if is_state('binary_sensor.frarik_asciugatrice_motore', 'off') else 'In funzione' }}
          tempo_ciclo_asciugatrice: >
            {% set hours = (as_timestamp(now()) - states('sensor.frarik_asciugatrice_tempo_riavvio') | float(0)) / 3600 %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours | int(0) / 24)) | int(0) %}
            {% if is_state('input_boolean.frarik_asciugatrice_ciclo_attivo', 'on') %}
              {% if day | int(0) > 0 %}
                {{ day }}d {{ (hours | int(0)) - (day * 24) }}h {{ minutes }}m
              {% elif hours | int(0) > 0 %}
                {{ hours }}h {{ minutes }}m
              {% else %}
                {{ minutes }}min
              {% endif %}
            {% else %}
              {{ states('input_text.frarik_asciugatrice_ultimo_ciclo') }}
            {% endif %}
          Oggi: >
            {% set hours = states('sensor.frarik_asciugatrice_tempo_oggi') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% if hours | int(0) > 0 %}
              {{ hours }}h {{ minutes }}m
            {% else %}
              {{ minutes }}min
            {% endif %}
          Mese: >
            {% set hours = states('sensor.frarik_asciugatrice_tempo_mese') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours | int / 24)) | int(0) %}
            {% if day | int(0) > 0 %}
              {{ day }}d {{ (hours | int) - (day * 24) }}h {{ minutes }}m
            {% elif hours | int(0) > 0 %}
              {{ hours }}h {{ minutes }}m
            {% else %}
              {{ minutes }}min
            {% endif %}
          Anno: >
            {% set hours = states('sensor.frarik_asciugatrice_tempo_anno') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours | int(0) / 24)) | int(0) %}
            {% if day | int(0) > 0 %}
              {{ day }}d {{ (hours | int(0)) - (day * 24) }}h {{ minutes }}m
            {% elif hours | int(0) > 0 %}
              {{ hours }}h {{ minutes }}m
            {% else %}
              {{ minutes }}min
            {% endif %}
          Ieri: >
            {% set hours = state_attr('sensor.frarik_asciugatrice_tempo_oggi', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% if hours | int(0) > 0 %}
              {{ hours }}h {{ minutes }}m
            {% else %}
              {{ minutes }}min
            {% endif %}
          Mese Precedente: >
            {% set hours = state_attr('sensor.frarik_asciugatrice_tempo_mese', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours | int / 24)) | int(0) %}
            {% if day | int(0) > 0 %}
              {{ day }}d {{ (hours | int) - (day * 24) }}h {{ minutes }}m
            {% elif hours | int(0) > 0 %}
              {{ hours }}h {{ minutes }}m
            {% else %}
              {{ minutes }}min
            {% endif %}
          Anno Precedente: >
            {% set hours = state_attr('sensor.frarik_asciugatrice_tempo_anno', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours | int(0) / 24)) | int(0) %}
            {% if day | int(0) > 0 %}
              {{ day }}d {{ (hours | int(0)) - (day * 24) }}h {{ minutes }}m
            {% elif hours | int(0) > 0 %}
              {{ hours }}h {{ minutes }}m
            {% else %}
              {{ minutes }}min
            {% endif %}
          consumo_ciclo_asciugatrice: >-
            {{ (states('sensor.frarik_asciugatrice_kwh') | float(0) - states('sensor.frarik_asciugatrice_inizio_ciclo') | float(0)) | round(2) }} kWh
          costo_ciclo_asciugatrice: >-
            {{ ((states('sensor.frarik_asciugatrice_kwh') | float(0) - states('sensor.frarik_asciugatrice_inizio_ciclo') | float(0)) * states('input_number.costo_energia') | float(0)) | round(2) }}
          costo_oggi_asciugatrice: >-
            {{ (states('sensor.frarik_asciugatrice_energy_oggi') | float(0) * states('input_number.costo_energia') | float(0)) | round(2) }}
          costo_mese_asciugatrice: >-
            {{ (states('sensor.frarik_asciugatrice_energy_mese') | float(0) * states('input_number.costo_energia') | float(0)) | round(2) }}
          costo_anno_asciugatrice: >-
            {{ (states('sensor.frarik_asciugatrice_energy_anno') | float(0) * states('input_number.costo_energia') | float(0)) | round(2) }}
          costo_ieri_asciugatrice: >-
            {{ (state_attr('sensor.frarik_asciugatrice_energy_oggi', 'last_period') | float(0) * states('input_number.costo_energia') | float(0)) | round(2) }}
          costo_mese_precedente_asciugatrice: >-
            {{ (state_attr('sensor.frarik_asciugatrice_energy_mese', 'last_period') | float(0) * states('input_number.costo_energia') | float(0)) | round(2) }}
          costo_anno_precedente_asciugatrice: >-
            {{ (state_attr('sensor.frarik_asciugatrice_energy_anno', 'last_period') | float(0) * states('input_number.costo_energia') | float(0)) | round(2) }}

      - name: frarik_asciugatrice_potenza_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash
        state: *sensore_potenza

####################################################
#                    COUNTER                       #
####################################################

counter:
  frarik_asciugatrice_cicli_totale:
    name: Cicli Asciugatrice Totale
    initial: 0
    step: 1

####################################################
#                 INPUT BOOLEAN                    #
####################################################

input_boolean:

  frarik_asciugatrice_switch:
    name: Switch Asciugatrice
    icon: mdi:power

  frarik_asciugatrice_ciclo_attivo:
    name: Ciclo Attivo Asciugatrice

  frarik_asciugatrice_notify_push:
    name: Notifica Push Asciugatrice

  frarik_asciugatrice_notify_alexa:
    name: Notifica Alexa Asciugatrice

  frarik_asciugatrice_notify_google:
    name: Notifica Google Asciugatrice

####################################################
#                     GROUP                        #
####################################################

group:
  frarik_asciugatrice_controlli:
    entities:
      - input_boolean.frarik_asciugatrice_notify_google
      - input_boolean.frarik_asciugatrice_notify_alexa
      - input_boolean.frarik_asciugatrice_notify_push
      - input_boolean.frarik_asciugatrice_switch

####################################################
#                INPUT DATETIME                    #
####################################################

input_datetime:

  frarik_asciugatrice_orario_inizio_notifiche:
    name: Orario Inizio Notifiche Asciugatrice
    has_date: false
    has_time: true

  frarik_asciugatrice_orario_fine_notifiche:
    name: Orario Fine Notifiche Asciugatrice
    has_date: false
    has_time: true

  frarik_asciugatrice_off_automatico:
    name: Asciugatrice Off Automatico
    has_date: false
    has_time: true

####################################################
#                  INPUT TEXT                      #
####################################################

input_text:

  frarik_asciugatrice_data_reset:

  frarik_asciugatrice_nome:

  frarik_asciugatrice_messaggio:

  frarik_asciugatrice_ultimo_ciclo:

  frarik_asciugatrice_cicli_lunedi:
  frarik_asciugatrice_tempo_lunedi:

  frarik_asciugatrice_cicli_martedi:
  frarik_asciugatrice_tempo_martedi:

  frarik_asciugatrice_cicli_mercoledi:
  frarik_asciugatrice_tempo_mercoledi:

  frarik_asciugatrice_cicli_giovedi:
  frarik_asciugatrice_tempo_giovedi:

  frarik_asciugatrice_cicli_venerdi:
  frarik_asciugatrice_tempo_venerdi:

  frarik_asciugatrice_cicli_sabato:
  frarik_asciugatrice_tempo_sabato:

  frarik_asciugatrice_cicli_domenica:
  frarik_asciugatrice_tempo_domenica:

####################################################
#                    SCRIPT                        #
####################################################

script:
  frarik_asciugatrice_reset_sensori:
    sequence:
    - service: input_text.set_value
      data:
        value: "{{ now().strftime('%d/%m/%Y %H:%M') }}"
      target:
        entity_id: input_text.frarik_asciugatrice_data_reset
    - service: utility_meter.calibrate
      data:
        value: '0'
      target:
        entity_id:
          - sensor.frarik_asciugatrice_cicli_oggi
          - sensor.frarik_asciugatrice_cicli_mese
          - sensor.frarik_asciugatrice_cicli_anno
          - sensor.frarik_asciugatrice_energy_oggi
          - sensor.frarik_asciugatrice_energy_mese
          - sensor.frarik_asciugatrice_energy_anno
          - sensor.frarik_asciugatrice_tempo_oggi
          - sensor.frarik_asciugatrice_tempo_mese
          - sensor.frarik_asciugatrice_tempo_anno
    - service: input_number.set_value
      data:
        value: '0'
      target:
        entity_id:
          - input_number.frarik_asciugatrice_consumo_lunedi
          - input_number.frarik_asciugatrice_consumo_martedi
          - input_number.frarik_asciugatrice_consumo_mercoledi
          - input_number.frarik_asciugatrice_consumo_giovedi
          - input_number.frarik_asciugatrice_consumo_venerdi
          - input_number.frarik_asciugatrice_consumo_sabato
          - input_number.frarik_asciugatrice_consumo_domenica
          - input_number.frarik_asciugatrice_costo_lunedi
          - input_number.frarik_asciugatrice_costo_martedi
          - input_number.frarik_asciugatrice_costo_mercoledi
          - input_number.frarik_asciugatrice_costo_giovedi
          - input_number.frarik_asciugatrice_costo_venerdi
          - input_number.frarik_asciugatrice_costo_sabato
          - input_number.frarik_asciugatrice_costo_domenica
    - service: input_text.set_value
      data:
        value: '0'
      target:
        entity_id:
          - input_text.frarik_asciugatrice_cicli_lunedi
          - input_text.frarik_asciugatrice_cicli_martedi
          - input_text.frarik_asciugatrice_cicli_mercoledi
          - input_text.frarik_asciugatrice_cicli_giovedi
          - input_text.frarik_asciugatrice_cicli_venerdi
          - input_text.frarik_asciugatrice_cicli_sabato
          - input_text.frarik_asciugatrice_cicli_domenica
          - input_text.frarik_asciugatrice_tempo_lunedi
          - input_text.frarik_asciugatrice_tempo_martedi
          - input_text.frarik_asciugatrice_tempo_mercoledi
          - input_text.frarik_asciugatrice_tempo_giovedi
          - input_text.frarik_asciugatrice_tempo_venerdi
          - input_text.frarik_asciugatrice_tempo_sabato
          - input_text.frarik_asciugatrice_tempo_domenica
    - service: counter.reset
      target:
        entity_id:
          - counter.frarik_asciugatrice_cicli_totale

####################################################
#                  AUTOMAZIONI                     #
####################################################

automation:

- alias: frarik_asciugatrice_automazione
  id: frarik_asciugatrice_automazione
  max_exceeded: silent
  trigger:

  - platform: state
    entity_id: binary_sensor.frarik_asciugatrice_motore
    from: 'off'
    to: 'on'
    id: inizio_ciclo

  - platform: state
    entity_id: binary_sensor.frarik_asciugatrice_motore
    from: 'on'
    to: 'off'
    id: fine_ciclo

  - platform: time
    at: '23:59:59'
    id: statistiche_settimanali

  - platform: state
    entity_id:
      - input_boolean.frarik_asciugatrice_switch
      - *switch_asciugatrice
    from: 'on'
    to: 'off'
    id: switch_off

  - platform: state
    entity_id:
      - input_boolean.frarik_asciugatrice_switch
      - *switch_asciugatrice
    from: 'off'
    to: 'on'
    id: switch_on

  - platform: template
    value_template: >-
      {{ is_state('binary_sensor.frarik_asciugatrice_motore','off') and
         is_state('input_boolean.frarik_asciugatrice_ciclo_attivo','on') }}
    id: controllo_ciclo

  action:

  - choose:
    - conditions:
      - condition: trigger
        id: statistiche_settimanali
      sequence:
      - service: input_text.set_value
        target:
          entity_id: >
            {% set g = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
            {{ {'Monday':'input_text.frarik_asciugatrice_cicli_lunedi','Tuesday':'input_text.frarik_asciugatrice_cicli_martedi','Wednesday':'input_text.frarik_asciugatrice_cicli_mercoledi','Thursday':'input_text.frarik_asciugatrice_cicli_giovedi','Friday':'input_text.frarik_asciugatrice_cicli_venerdi','Saturday':'input_text.frarik_asciugatrice_cicli_sabato','Sunday':'input_text.frarik_asciugatrice_cicli_domenica'}[g] }}
        data:
          value: "{{ states('sensor.frarik_asciugatrice_cicli_oggi') }}"
      - service: input_text.set_value
        target:
          entity_id: >
            {% set g = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
            {{ {'Monday':'input_text.frarik_asciugatrice_tempo_lunedi','Tuesday':'input_text.frarik_asciugatrice_tempo_martedi','Wednesday':'input_text.frarik_asciugatrice_tempo_mercoledi','Thursday':'input_text.frarik_asciugatrice_tempo_giovedi','Friday':'input_text.frarik_asciugatrice_tempo_venerdi','Saturday':'input_text.frarik_asciugatrice_tempo_sabato','Sunday':'input_text.frarik_asciugatrice_tempo_domenica'}[g] }}
        data:
          value: "{{ state_attr('sensor.frarik_asciugatrice_time_on','Oggi') }}"
      - service: input_number.set_value
        target:
          entity_id: >
            {% set g = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
            {{ {'Monday':'input_number.frarik_asciugatrice_consumo_lunedi','Tuesday':'input_number.frarik_asciugatrice_consumo_martedi','Wednesday':'input_number.frarik_asciugatrice_consumo_mercoledi','Thursday':'input_number.frarik_asciugatrice_consumo_giovedi','Friday':'input_number.frarik_asciugatrice_consumo_venerdi','Saturday':'input_number.frarik_asciugatrice_consumo_sabato','Sunday':'input_number.frarik_asciugatrice_consumo_domenica'}[g] }}
        data:
          value: "{{ states('sensor.frarik_asciugatrice_energy_oggi') }}"
      - service: input_number.set_value
        target:
          entity_id: >
            {% set g = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
            {{ {'Monday':'input_number.frarik_asciugatrice_costo_lunedi','Tuesday':'input_number.frarik_asciugatrice_costo_martedi','Wednesday':'input_number.frarik_asciugatrice_costo_mercoledi','Thursday':'input_number.frarik_asciugatrice_costo_giovedi','Friday':'input_number.frarik_asciugatrice_costo_venerdi','Saturday':'input_number.frarik_asciugatrice_costo_sabato','Sunday':'input_number.frarik_asciugatrice_costo_domenica'}[g] }}
        data:
          value: "{{ state_attr('sensor.frarik_asciugatrice_time_on','costo_oggi_asciugatrice') }}"

  - choose:
    - conditions:
      - condition: trigger
        id: switch_off
      sequence:
      - service: switch.turn_off
        target:
          entity_id: *switch_asciugatrice
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.frarik_asciugatrice_switch

  - choose:
    - conditions:
      - condition: trigger
        id: switch_on
      sequence:
      - service: switch.turn_on
        target:
          entity_id: *switch_asciugatrice
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.frarik_asciugatrice_switch

  - choose:
    - conditions:
      - condition: trigger
        id: controllo_ciclo
      sequence:
      - delay: '00:01:00'
      - entity_id: input_boolean.frarik_asciugatrice_ciclo_attivo
        service: input_boolean.turn_off

  - choose:
    - conditions:
      - condition: trigger
        id: inizio_ciclo
      sequence:
      - entity_id: input_boolean.frarik_asciugatrice_ciclo_attivo
        service: input_boolean.turn_on

  - choose:
    - conditions:
      - condition: trigger
        id: fine_ciclo
      sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.frarik_asciugatrice_ultimo_ciclo
        data:
          value: "{{ state_attr('sensor.frarik_asciugatrice_time_on','tempo_ciclo_asciugatrice') | trim }}"
      - service: counter.increment
        target:
          entity_id:
            - counter.frarik_asciugatrice_cicli_totale
      - delay: '00:00:05'
      - entity_id: input_boolean.frarik_asciugatrice_ciclo_attivo
        service: input_boolean.turn_off

  - parallel:

    - choose:
      - conditions:
        - condition: trigger
          id: fine_ciclo
        - condition: time
          after: 'input_datetime.frarik_asciugatrice_orario_inizio_notifiche'
          before: 'input_datetime.frarik_asciugatrice_orario_fine_notifiche'
        - condition: state
          entity_id: input_boolean.frarik_asciugatrice_notify_google
          state: 'on'
        sequence:
        - service: tts.google_translate_say
          continue_on_error: true
          data:
            entity_id: *google
            message: >-
              {%- set dur=states('input_text.frarik_asciugatrice_ultimo_ciclo')|trim -%}
              {%- set h=dur.split('h')[0]|int(0) if 'h' in dur else 0 -%}
              {%- set m=((dur.split('h')[1] if 'h' in dur else dur)|replace('min','')|replace('m','')|trim)|int(0) -%}
              {%- set hv='' if h==0 else ("un'ora" if h==1 else h|string+' ore') -%}
              {%- set mv='' if m==0 else ('un minuto' if m==1 else m|string+' minuti') -%}
              {%- set sep=' e ' if h>0 and m>0 else '' -%}
              {{- states('input_text.frarik_asciugatrice_messaggio') }} in {{ hv+sep+mv -}}

    - choose:
      - conditions:
        - condition: trigger
          id: fine_ciclo
        - condition: time
          after: 'input_datetime.frarik_asciugatrice_orario_inizio_notifiche'
          before: 'input_datetime.frarik_asciugatrice_orario_fine_notifiche'
        - condition: state
          entity_id: input_boolean.frarik_asciugatrice_notify_alexa
          state: 'on'
        sequence:
        - service: notify.alexa_media
          continue_on_error: true
          data:
            target: *alexa
            data:
              type: announce
              method: spoken
            message: >-
              {%- set dur=states('input_text.frarik_asciugatrice_ultimo_ciclo')|trim -%}
              {%- set h=dur.split('h')[0]|int(0) if 'h' in dur else 0 -%}
              {%- set m=((dur.split('h')[1] if 'h' in dur else dur)|replace('min','')|replace('m','')|trim)|int(0) -%}
              {%- set hv='' if h==0 else ("un'ora" if h==1 else h|string+' ore') -%}
              {%- set mv='' if m==0 else ('un minuto' if m==1 else m|string+' minuti') -%}
              {%- set sep=' e ' if h>0 and m>0 else '' -%}
              {{- states('input_text.frarik_asciugatrice_messaggio') }} in {{ hv+sep+mv -}}

    - choose:
      - conditions:
        - condition: trigger
          id: fine_ciclo
        - condition: state
          entity_id: input_boolean.frarik_asciugatrice_notify_push
          state: 'on'
        sequence:
        - repeat:
            for_each: *push
            sequence:
            - service: "notify.{{ repeat.item.service }}"
              continue_on_error: true
              data:
                title: "{{ states('input_text.frarik_asciugatrice_nome') }}"
                message: >-
                  🫧 {{ states('input_text.frarik_asciugatrice_messaggio') }}

                  ⏱ Ciclo durato: {{ states('input_text.frarik_asciugatrice_ultimo_ciclo') | trim }}

                  ⚡ Consumati: {{ state_attr('sensor.frarik_asciugatrice_time_on','consumo_ciclo_asciugatrice') }}

                  💰 Spesi: {{ state_attr('sensor.frarik_asciugatrice_time_on','costo_ciclo_asciugatrice') }} €

####################################################

- alias: frarik_asciugatrice_off_automatico
  id: frarik_asciugatrice_off_automatico
  trigger:
    - platform: time
      at: 'input_datetime.frarik_asciugatrice_off_automatico'
      id: auto_off
  condition: []
  action:
    - choose:
      - conditions:
        - condition: trigger
          id: auto_off
        - condition: state
          entity_id: *switch_asciugatrice
          state: 'on'
        sequence:
        - entity_id: *switch_asciugatrice
          service: switch.turn_off

