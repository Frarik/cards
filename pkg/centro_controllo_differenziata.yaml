homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: 'Centro Controllo Raccolta Differenziata 1.0'
        author: 'DomHouse.it'
        reference: ' WebSite: www.domhouse.it '

####################################################
#                                                  #
#              IMPOSTAZIONI PACKAGE                #
#                                                  #
####################################################

      setting:
        Lista MediaPlayer Google: &google
          - media_player.alexa_sala

        Lista mediaplayer alexa: &alexa
          - media_player.alexa_sala

        Device per notifica push: &push
          - service: mobile_app_a065

####################################################
#                                                  #
#              NOTIFICHE GRUPPO                    #
#                                                  #
####################################################

notify:
  - name: Gruppo Centro Raccolta Differenziata
    platform: group
    services: *push

####################################################
#                                                  #
#                  INPUT SELECT                    #
#                                                  #
####################################################

input_select:
  inserimento_rifiuti:
    name: Inserimento Rifiuti
    options:
      - Rifiuti

####################################################
#                                                  #
#                  INPUT TEXT                      #
#                                                  #
####################################################

input_text:
  rifiuto_lunedi:
    name: Rifiuto Lunedì
    icon: mdi:delete-variant

  rifiuto_martedi:
    name: Rifiuto Martedì
    icon: mdi:delete-variant

  rifiuto_mercoledi:
    name: Rifiuto Mercoledì
    icon: mdi:delete-variant

  rifiuto_giovedi:
    name: Rifiuto Giovedì
    icon: mdi:delete-variant

  rifiuto_venerdi:
    name: Rifiuto Venerdì
    icon: mdi:delete-variant

  rifiuto_sabato:
    name: Rifiuto Sabato
    icon: mdi:delete-variant

  rifiuto_domenica:
    name: Rifiuto Domenica
    icon: mdi:delete-variant

####################################################
#                                                  #
#              RACCOLTA DIFFERENZIATA              #
#                                                  #
####################################################

template:
  - sensor:
      - name: Raccolta Differenziata
        state: >-
          {% if now().weekday() == 0 -%}
          {{ states('input_text.rifiuto_lunedi') }}
          {%- elif now().weekday() == 1 -%}
          {{ states('input_text.rifiuto_martedi') }}
          {%- elif now().weekday() == 2 -%}
          {{ states('input_text.rifiuto_mercoledi') }}
          {%- elif now().weekday() == 3 -%}
          {{ states('input_text.rifiuto_giovedi') }}
          {%- elif now().weekday() == 4 -%}
          {{ states('input_text.rifiuto_venerdi') }}
          {%- elif now().weekday() == 5 -%}
          {{ states('input_text.rifiuto_sabato') }}
          {%- elif now().weekday() == 6 -%}
          {{ states('input_text.rifiuto_domenica') }}
          {%- endif %}

####################################################
#                                                  #
#                   SENSORI                        #
#                                                  #
####################################################
sensor:
  - platform: template
    sensors:
      sensore_centro_controllo_raccolta_differenziata:
        value_template: "{% if is_state('input_boolean.null', 'on') %}1.0{% else %}1.0{% endif %}"

####################################################
#                                                  #
#                  INPUT DATETIME                  #
#                                                  #
####################################################

input_datetime:
  orario_notifica_differenziata:
    name: Orario Notifica Differenziata
    has_date: false
    has_time: true

####################################################
#                                                  #
#                     GROUP                        #
#                                                  #
####################################################

group:
  notifiche_differenziata:
    entities:
      - input_boolean.notify_push_raccolta_differenziata
      - input_boolean.notify_alexa_raccolta_differenziata
      - input_boolean.notify_google_raccolta_differenziata

####################################################
#                                                  #
#               INPUT BOOLEAN                      #
#                                                  #
####################################################

input_boolean:
  notify_push_raccolta_differenziata:
    name: Notifica Push

  ####################################################

  notify_alexa_raccolta_differenziata:
    name: Notifica Alexa

  ####################################################

  notify_google_raccolta_differenziata:
    name: Notifica Google

####################################################

  aggiornamento_pkg_raccolta_differenziata:
    name: Aggiornamento package Raccolta differenziata

####################################################
#                                                  #
#                     AUTOMAZIONI                  #
#                                                  #
####################################################

automation:

- alias: Raccolta Differenziata
  id: Raccolta Differenziata
  trigger:
    - platform: time
      at: 'input_datetime.orario_notifica_differenziata'
      id: notifica

    - platform: state
      entity_id: sensor.domhouse_it
      attribute: centro_controllo_differenziata
      not_to: '1.0'
      id: aggiornamento

  condition: []
  action:

####################################################
# Aggiornamento

    - choose:
      - conditions:
        - condition: trigger
          id: aggiornamento
        - condition: state
          entity_id: input_boolean.aggiornamento_pkg_raccolta_differenziata
          state: 'on'
        - condition: not
          conditions:
            - condition: state
              entity_id: sensor.domhouse_it
              attribute: centro_controllo_differenziata
              state:
                - unknown
                - unavailable
                - none
                -
        sequence:
        - data_template:
            message: "Centro Controllo Raccolta Differenziata {{ state_attr('sensor.domhouse_it','centro_controllo_differenziata') }} è ora disponibile."
            title: "📥 Nuovo Aggiornamento 📥"
            data:
              actions:
                - action: 'URI'
                  title: "SCARICA UPDATE"
                  uri: "https://pkg.domhouse.it/centro-controllo-raccolta-differenziata-in-home-assistant/"
          service: notify.gruppo_centro_raccolta_differenziata


####################################################
# Notifica Google

    - parallel:
      - choose:
        - conditions:
          - condition: trigger
            id: notifica
          - condition: state
            entity_id: input_boolean.notify_google_raccolta_differenziata
            state: 'on'
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.raccolta_differenziata
                state: "Nessun Ritiro"
          sequence:
          - service: tts.google_translate_say
            continue_on_error: true
            entity_id: *google
            data:
              message: "Oggi ricordati di buttare {{ states('sensor.raccolta_differenziata') }}"

####################################################
# Notifica Google Nessun Ritiro

      - choose:
        - conditions:
          - condition: trigger
            id: notifica
          - condition: state
            entity_id: input_boolean.notify_google_raccolta_differenziata
            state: 'on'
          - condition: state
            entity_id: 'sensor.raccolta_differenziata'
            state: 'Nessun Ritiro'
          sequence:
          - service: tts.google_translate_say
            continue_on_error: true
            entity_id: *google
            data:
              message: "Oggi non si butta niente"

####################################################
# Notifica Alexa

      - choose:
        - conditions:
          - condition: trigger
            id: notifica
          - condition: state
            entity_id: input_boolean.notify_alexa_raccolta_differenziata
            state: 'on'
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.raccolta_differenziata
                state: "Nessun Ritiro"
          sequence:
          - service: notify.alexa_media
            continue_on_error: true
            data:
              target: *alexa
              data:
                type: announce
                method: spoken
              message: "Oggi ricordati di buttare {{ states('sensor.raccolta_differenziata') }}"

####################################################
# Notifica Alexa Nessun Ritiro

      - choose:
        - conditions:
          - condition: trigger
            id: notifica
          - condition: state
            entity_id: input_boolean.notify_alexa_raccolta_differenziata
            state: 'on'
          - condition: state
            entity_id: 'sensor.raccolta_differenziata'
            state: 'Nessun Ritiro'
          sequence:
          - service: notify.alexa_media
            continue_on_error: true
            data:
              target: *alexa
              data:
                type: announce
                method: spoken
              message: "Oggi non si butta niente"

####################################################
# Notifica Push

      - choose:
        - conditions:
          - condition: trigger
            id: notifica
          - condition: state
            entity_id: input_boolean.notify_push_raccolta_differenziata
            state: 'on'
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.raccolta_differenziata
                state: "Nessun Ritiro"
          sequence:
          - data_template:
              message: "Buttare {{ states('sensor.raccolta_differenziata') }}"
              title: "Raccolta Differenziata ♻"
            service: notify.gruppo_centro_raccolta_differenziata
            continue_on_error: true

####################################################
# Notifica Push Nessun Ritiro

      - choose:
        - conditions:
          - condition: trigger
            id: notifica
          - condition: state
            entity_id: input_boolean.notify_push_raccolta_differenziata
            state: 'on'
          - condition: state
            entity_id: 'sensor.raccolta_differenziata'
            state: 'Nessun Ritiro'
          sequence:
          - data_template:
              message: "Nessun Ritiro"
              title: "Raccolta Differenziata ♻"
            service: notify.gruppo_centro_raccolta_differenziata
            continue_on_error: true

####################################################
