homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: 'Frarik Bolletta 10'
        author: 'Frarik'
        reference: 'github.com/Frarik/cards'
      setting:

####################################################
#                                                  #
#              IMPOSTAZIONI PACKAGE                #
#                                                  #
####################################################

        Sensore Potenza Casa: &sensore_potenza_bolletta sensor.IL_TUO_SENSORE_POTENZA_CASA

        Device per notifica push: &push notify.IL_TUO_MOBILE_APP

        Media Player Alexa: &alexa media_player.IL_TUO_ALEXA

####################################################
#                                                  #
#                VERSIONE PACKAGE                  #
#                                                  #
####################################################

# ==============================================================================
# 1. INPUT NUMBER (PREZZI, PARAMETRI E STORICO)
# ==============================================================================
input_number:

  # --- BONUS / SCONTO ---
  frarik_bolletta_bonus_bolletta:
    name: Bonus / Sconto in Bolletta
    min: 0
    max: 500
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    icon: mdi:gift
    initial: 0.00

  # --- PREZZI VARIABILI (COMPONENTI ENERGIA) ---
  frarik_bolletta_prezzo_energia_base:
    name: Prezzo Energia (Fisso)
    min: 0
    max: 1
    step: 0.000001
    unit_of_measurement: "€/kWh"
    mode: box
    initial: 0.090000

  frarik_bolletta_prezzo_dispacciamento:
    name: Dispacciamento
    min: 0
    max: 1
    step: 0.000001
    unit_of_measurement: "€/kWh"
    mode: box
    initial: 0.009800

  frarik_bolletta_prezzo_mercato_capacita:
    name: Mercato Capacità
    min: 0
    max: 1
    step: 0.000001
    unit_of_measurement: "€/kWh"
    mode: box
    initial: 0.004275

  # --- COEFFICIENTE PERDITE ---
  frarik_bolletta_fattore_perdite:
    name: Moltiplicatore Perdite
    min: 1
    max: 1.2
    step: 0.000001
    mode: box
    initial: 1.103261

  # --- ALTRI PREZZI VARIABILI (SOLO SU KWH LETTI) ---
  frarik_bolletta_prezzo_trasporto_energia:
    name: Trasporto Quota Energia
    min: 0
    max: 1
    step: 0.000001
    unit_of_measurement: "€/kWh"
    mode: box
    initial: 0.011890

  frarik_bolletta_prezzo_oneri_sistema:
    name: Oneri Sistema (ASOS+ARIM)
    min: 0
    max: 1
    step: 0.000001
    unit_of_measurement: "€/kWh"
    mode: box
    initial: 0.031322

  frarik_bolletta_prezzo_uc3_uc6:
    name: Oneri Variabili UC3+UC6
    min: 0
    max: 1
    step: 0.000001
    unit_of_measurement: "€/kWh"
    mode: box
    initial: 0.001630

  frarik_bolletta_prezzo_accise:
    name: Accise
    min: 0
    max: 1
    step: 0.000001
    unit_of_measurement: "€/kWh"
    mode: box
    initial: 0.022700

  # --- QUOTE FISSE MENSILI ---
  frarik_bolletta_quota_comm_vendita:
    name: Commercializzazione + DISPbt
    min: 0
    max: 20
    step: 0.000001
    unit_of_measurement: "€"
    mode: box
    initial: 6.102592

  frarik_bolletta_quota_trasporto_fisso:
    name: Trasporto Fisso
    min: 0
    max: 20
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    initial: 1.90

  # --- POTENZA ---
  frarik_bolletta_potenza_impegnata:
    name: Potenza Impegnata (kW)
    min: 1
    max: 10
    step: 0.1
    unit_of_measurement: "kW"
    mode: box
    initial: 4.5

  frarik_bolletta_prezzo_quota_potenza:
    name: Quota Potenza (€/kW mese)
    min: 0
    max: 10
    step: 0.000001
    unit_of_measurement: "€"
    mode: box
    initial: 2.106567

  # --- TASSE E CANONE ---
  frarik_bolletta_iva_perc:
    name: IVA %
    min: 0
    max: 22
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial: 10

  frarik_bolletta_canone_rai:
    name: Canone RAI
    min: 0
    max: 20
    step: 1
    unit_of_measurement: "€"
    mode: box
    initial: 9.00

  # --- SIMULATORE TEST ---
  frarik_bolletta_test_kwh:
    name: Test kWh
    min: 0
    max: 1000
    step: 1
    mode: box
    initial: 0

  # --- DATI FOTOVOLTAICO E BATTERIA ---
  frarik_bolletta_autoconsumo_fv:
    name: kWh da Pannelli (Autoconsumo)
    min: 0
    max: 1000
    step: 1
    mode: box
    unit_of_measurement: "kWh"
    initial: 0

  frarik_bolletta_autoconsumo_batt:
    name: kWh da Batteria
    min: 0
    max: 1000
    step: 1
    mode: box
    unit_of_measurement: "kWh"
    initial: 0

# --- SOGLIE ALLARME CARICHI ---
  frarik_bolletta_soglia_power:
    name: Soglia Allarme Watt
    min: 3000
    max: 6000
    step: 100
    unit_of_measurement: "W"
    mode: box
    icon: mdi:flash-alert

  frarik_bolletta_ritardo_soglia:
    name: Ritardo Allarme (Secondi)
    min: 0
    max: 120
    step: 5
    unit_of_measurement: "sec"
    mode: box
    icon: mdi:timer-alert
    initial: 5

# ==============================================================================
  # DATI SETTIMANALI (LUN-DOM)
  # ==============================================================================

  # --- LUNEDI ---
  frarik_bolletta_lunedi_kwh: { name: "Lunedì kWh", min: 0, max: 999, step: 0.1, mode: box, unit_of_measurement: "kWh", icon: mdi:calendar }
  frarik_bolletta_lunedi_eur: { name: "Lunedì Euro", min: 0, max: 999, step: 0.01, mode: box, unit_of_measurement: "€", icon: mdi:currency-eur }

  # --- MARTEDI ---
  frarik_bolletta_martedi_kwh: { name: "Martedì kWh", min: 0, max: 999, step: 0.1, mode: box, unit_of_measurement: "kWh", icon: mdi:calendar }
  frarik_bolletta_martedi_eur: { name: "Martedì Euro", min: 0, max: 999, step: 0.01, mode: box, unit_of_measurement: "€", icon: mdi:currency-eur }

  # --- MERCOLEDI ---
  frarik_bolletta_mercoledi_kwh: { name: "Mercoledì kWh", min: 0, max: 999, step: 0.1, mode: box, unit_of_measurement: "kWh", icon: mdi:calendar }
  frarik_bolletta_mercoledi_eur: { name: "Mercoledì Euro", min: 0, max: 999, step: 0.01, mode: box, unit_of_measurement: "€", icon: mdi:currency-eur }

  # --- GIOVEDI ---
  frarik_bolletta_giovedi_kwh: { name: "Giovedì kWh", min: 0, max: 999, step: 0.1, mode: box, unit_of_measurement: "kWh", icon: mdi:calendar }
  frarik_bolletta_giovedi_eur: { name: "Giovedì Euro", min: 0, max: 999, step: 0.01, mode: box, unit_of_measurement: "€", icon: mdi:currency-eur }

  # --- VENERDI ---
  frarik_bolletta_venerdi_kwh: { name: "Venerdì kWh", min: 0, max: 999, step: 0.1, mode: box, unit_of_measurement: "kWh", icon: mdi:calendar }
  frarik_bolletta_venerdi_eur: { name: "Venerdì Euro", min: 0, max: 999, step: 0.01, mode: box, unit_of_measurement: "€", icon: mdi:currency-eur }

  # --- SABATO ---
  frarik_bolletta_sabato_kwh: { name: "Sabato kWh", min: 0, max: 999, step: 0.1, mode: box, unit_of_measurement: "kWh", icon: mdi:calendar }
  frarik_bolletta_sabato_eur: { name: "Sabato Euro", min: 0, max: 999, step: 0.01, mode: box, unit_of_measurement: "€", icon: mdi:currency-eur }

  # --- DOMENICA ---
  frarik_bolletta_domenica_kwh: { name: "Domenica kWh", min: 0, max: 999, step: 0.1, mode: box, unit_of_measurement: "kWh", icon: mdi:calendar }
  frarik_bolletta_domenica_eur: { name: "Domenica Euro", min: 0, max: 999, step: 0.01, mode: box, unit_of_measurement: "€", icon: mdi:currency-eur }

  # --- STORICO ANNO PRECEDENTE ---
  # kWh Anno Precedente
  frarik_bolletta_storico_prec_gennaio_kwh: { name: "Storico Prec Gennaio kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_febbraio_kwh: { name: "Storico Prec Febbraio kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_marzo_kwh: { name: "Storico Prec Marzo kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_aprile_kwh: { name: "Storico Prec Aprile kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_maggio_kwh: { name: "Storico Prec Maggio kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_giugno_kwh: { name: "Storico Prec Giugno kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_luglio_kwh: { name: "Storico Prec Luglio kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_agosto_kwh: { name: "Storico Prec Agosto kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_settembre_kwh: { name: "Storico Prec Settembre kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_ottobre_kwh: { name: "Storico Prec Ottobre kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_novembre_kwh: { name: "Storico Prec Novembre kWh", min: 0, max: 99999, step: 0.1, mode: box }
  frarik_bolletta_storico_prec_dicembre_kwh: { name: "Storico Prec Dicembre kWh", min: 0, max: 99999, step: 0.1, mode: box }

  # Euro Anno Precedente
  frarik_bolletta_storico_prec_gennaio_eur: { name: "Storico Prec Gennaio Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_febbraio_eur: { name: "Storico Prec Febbraio Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_marzo_eur: { name: "Storico Prec Marzo Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_aprile_eur: { name: "Storico Prec Aprile Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_maggio_eur: { name: "Storico Prec Maggio Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_giugno_eur: { name: "Storico Prec Giugno Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_luglio_eur: { name: "Storico Prec Luglio Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_agosto_eur: { name: "Storico Prec Agosto Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_settembre_eur: { name: "Storico Prec Settembre Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_ottobre_eur: { name: "Storico Prec Ottobre Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_novembre_eur: { name: "Storico Prec Novembre Euro", min: 0, max: 9999, step: 0.01, mode: box }
  frarik_bolletta_storico_prec_dicembre_eur: { name: "Storico Prec Dicembre Euro", min: 0, max: 9999, step: 0.01, mode: box }

# ==============================================================================
# 2. INPUT BOOLEAN (INTERRUTTORI)
# ==============================================================================
input_boolean:
  # Usato SOLO per il simulatore test manuale
  frarik_bolletta_include_canone:
    name: Includi Canone RAI (Test)
    initial: off

  frarik_bolletta_notify_report:
    name: "Abilita Report (Master)"
    icon: mdi:file-document-outline
    initial: on

  # --- ABILITAZIONE FONTI ---
  frarik_bolletta_ha_fotovoltaico:
    name: "Includi Pannelli Solari"
    icon: mdi:solar-power
    initial: off
  frarik_bolletta_ha_batteria:
    name: "Includi Batteria"
    icon: mdi:battery-high
    initial: off

# --- ABILITAZIONE NOTIFICHE ---
  frarik_bolletta_notify_daily:
    name: "Notifica Giornaliera"
    icon: mdi:calendar-today
    initial: on

  frarik_bolletta_notify_monthly:
    name: "Notifica Mensile"
    icon: mdi:calendar-month
    initial: on

  frarik_bolletta_notify_yearly:
    name: "Notifica Annuale"
    icon: mdi:calendar-star
    initial: on

  frarik_bolletta_notify_overload:
    name: Abilita Allarme Sovraccarico
    icon: mdi:flash-alert
    initial: on

# Interruttori distinti per i dispositivi
  frarik_bolletta_notify_push_active:
    name: "Attiva Notifiche Cellulare"
    icon: mdi:cellphone-message
    initial: on

  frarik_bolletta_notify_alexa_active:
    name: "Attiva Voce Alexa"
    icon: mdi:account-voice
    initial: on

# ==============================================================================
# 2.1 INPUT DATETIME
# ==============================================================================
input_datetime:

# --- ORARI NOTIFICHE ALEXA ---
  frarik_bolletta_notifica_inizio:
    name: Inizio Notifiche Alexa
    has_date: false
    has_time: true
    initial: "00:00:00"

  frarik_bolletta_notifica_fine:
    name: Fine Notifiche Alexa
    has_date: false
    has_time: true
    initial: "00:00:00"

# Orari Cellulare
  frarik_bolletta_push_inizio:
    name: Inizio Push
    has_date: false
    has_time: true
    initial: "00:00:00"
  frarik_bolletta_push_fine:
    name: Fine Push
    has_date: false
    has_time: true
    initial: "00:00:00"

# ==============================================================================
# 3. SORGENTE DATI (INTEGRAL)
# ==============================================================================
sensor:
  - platform: integration
    name: Frarik Bolletta Energia Totale
    source: *sensore_potenza_bolletta
    unit_prefix: k
    round: 4
    method: trapezoidal
    unit_time: h

# ==============================================================================
# 4. CONTATORI UTILITY METER
# ==============================================================================
utility_meter:
  frarik_bolletta_consumo_giornaliero:
    source: sensor.frarik_bolletta_energia_totale
    cycle: daily
  frarik_bolletta_consumo_mensile:
    source: sensor.frarik_bolletta_energia_totale
    cycle: monthly
  frarik_bolletta_consumo_annuale:
    source: sensor.frarik_bolletta_energia_totale
    cycle: yearly

# ==============================================================================
# 5. CALCOLI TEMPLATE E ARCHIVIO
# ==============================================================================
template:
  - sensor:

      - name: "frarik_bolletta_versione"
        unique_id: frarik_bolletta_versione
        state: "10"

      # 1. PREZZO REALE "FINITO" PER 1 kWh LETTO DAL CONTATORE
      - name: "Frarik Bolletta Prezzo Unico Variabile"
        unique_id: frarik_bolletta_prezzo_unico_variabile
        unit_of_measurement: "€/kWh"
        state: >
          {% set p_energia = states('input_number.frarik_bolletta_prezzo_energia_base') | float(0) %}
          {% set p_disp = states('input_number.frarik_bolletta_prezzo_dispacciamento') | float(0) %}
          {% set p_cap = states('input_number.frarik_bolletta_prezzo_mercato_capacita') | float(0) %}
          {% set factor = states('input_number.frarik_bolletta_fattore_perdite') | float(1.1) %}

          {% set p_trasp_en = states('input_number.frarik_bolletta_prezzo_trasporto_energia') | float(0) %}
          {% set p_oneri = states('input_number.frarik_bolletta_prezzo_oneri_sistema') | float(0) %}
          {% set p_uc = states('input_number.frarik_bolletta_prezzo_uc3_uc6') | float(0) %}
          {% set p_accise = states('input_number.frarik_bolletta_prezzo_accise') | float(0) %}

          {# Componenti soggette a perdite #}
          {% set quota_maggiorata = (p_energia + p_disp + p_cap) * factor %}

          {# Componenti pulite #}
          {% set quota_pulita = p_trasp_en + p_oneri + p_uc + p_accise %}

          {{ (quota_maggiorata + quota_pulita) | round(6) }}

      # 2. TOTALE COSTI FISSI MENSILI (IVA ESCLUSA)
      - name: "Frarik Bolletta Totale Fissi Mese"
        unique_id: frarik_bolletta_totale_fissi_mese
        unit_of_measurement: "€"
        state: >
          {% set comm = states('input_number.frarik_bolletta_quota_comm_vendita') | float(0) %}
          {% set trasp_f = states('input_number.frarik_bolletta_quota_trasporto_fisso') | float(0) %}
          {% set kw = states('input_number.frarik_bolletta_potenza_impegnata') | float(0) %}
          {% set p_kw = states('input_number.frarik_bolletta_prezzo_quota_potenza') | float(0) %}

          {{ (comm + trasp_f + (kw * p_kw)) | round(4) }}

      # 3. COSTO BOLLETTA MENSILE DINAMICO (IVA INCLUSA - BONUS - RAI AUTO)
      - name: "Frarik Bolletta Mese Corrente"
        unique_id: frarik_bolletta_mese_corrente
        unit_of_measurement: "€"
        state: >
          {% set kwh = states('sensor.frarik_bolletta_consumo_mensile') | float(0) %}
          {% set price_kwh = states('sensor.frarik_bolletta_prezzo_unico_variabile') | float(0) %}
          {% set fixed = states('sensor.frarik_bolletta_totale_fissi_mese') | float(0) %}
          {% set iva = states('input_number.frarik_bolletta_iva_perc') | float(10) / 100 %}
          {% set bonus = states('input_number.frarik_bolletta_bonus_bolletta') | float(0) %}

          {# LOGICA AUTOMATICA CANONE RAI: Solo Gennaio-Ottobre (mesi 1-10) #}
          {% set mese_corrente = now().month %}
          {% if mese_corrente >= 1 and mese_corrente <= 10 %}
            {% set canone = 9.00 %}
          {% else %}
            {% set canone = 0.00 %}
          {% endif %}

          {% set imponibile = (kwh * price_kwh) + fixed %}
          {% set tot_con_iva = imponibile * (1 + iva) %}
          {% set finale = tot_con_iva + canone - bonus %}

          {{ finale | round(2) }}

      # 4. PREVISIONE FINE MESE (CON BONUS APPLICATO E RAI AUTO)
      - name: "Frarik Bolletta Previsione Costo Mese"
        unique_id: frarik_bolletta_previsione_costo_mese
        unit_of_measurement: "€"
        state: >
          {% set kwh_attuale = states('sensor.frarik_bolletta_consumo_mensile') | float(0) %}
          {% set price_kwh = states('sensor.frarik_bolletta_prezzo_unico_variabile') | float(0) %}
          {% set fixed = states('sensor.frarik_bolletta_totale_fissi_mese') | float(0) %}
          {% set iva = states('input_number.frarik_bolletta_iva_perc') | float(10) / 100 %}
          {% set bonus = states('input_number.frarik_bolletta_bonus_bolletta') | float(0) %}

          {# LOGICA AUTOMATICA CANONE RAI #}
          {% set mese_corrente = now().month %}
          {% if mese_corrente >= 1 and mese_corrente <= 10 %}
            {% set canone = 9.00 %}
          {% else %}
            {% set canone = 0.00 %}
          {% endif %}

          {% set oggi = now().day %}
          {% set fine_mese = ((now().replace(day=28) + timedelta(days=4)).replace(day=1) - timedelta(days=1)).day %}

          {# Proietto solo i kWh #}
          {% if oggi > 0 %}
             {% set kwh_previsti = (kwh_attuale / oggi * fine_mese) %}
          {% else %}
             {% set kwh_previsti = kwh_attuale %}
          {% endif %}

          {% set imponibile = (kwh_previsti * price_kwh) + fixed %}
          {% set tot_con_iva = imponibile * (1 + iva) %}

          {{ (tot_con_iva + canone - bonus) | round(2) }}

      # 5. SIMULATORE TEST (MANUALE)
      - name: "Frarik Bolletta Test Bolletta"
        unique_id: frarik_bolletta_test_bolletta
        unit_of_measurement: "€"
        state: >
          {% set kwh = states('input_number.frarik_bolletta_test_kwh') | float(0) %}
          {% set price_kwh = states('sensor.frarik_bolletta_prezzo_unico_variabile') | float(0) %}
          {% set fixed = states('sensor.frarik_bolletta_totale_fissi_mese') | float(0) %}
          {% set iva = states('input_number.frarik_bolletta_iva_perc') | float(10) / 100 %}
          {% set bonus = states('input_number.frarik_bolletta_bonus_bolletta') | float(0) %}

          {# QUI IL CANONE RIMANE MANUALE PER SIMULAZIONI #}
          {% set canone = 9.00 if is_state('input_boolean.frarik_bolletta_include_canone', 'on') else 0 %}

          {% set imponibile = (kwh * price_kwh) + fixed %}
          {% set tot = (imponibile * (1 + iva)) + canone - bonus %}

          {{ tot | round(2) }}

      # 6. CONSUMO TOTALE CASA REALE
      - name: "Frarik Bolletta Consumo Totale Casa"
        unique_id: frarik_bolletta_consumo_totale_casa
        unit_of_measurement: "kWh"
        state: >
          {# 1. Prendo il dato dalla Rete (sempre presente) #}
          {% set rete = states('sensor.frarik_bolletta_consumo_mensile') | float(0) %}

          {# 2. Se FV ON, aggiungo i kWh dei pannelli, altrimenti 0 #}
          {% if is_state('input_boolean.frarik_bolletta_ha_fotovoltaico', 'on') %}
            {% set fv = states('input_number.frarik_bolletta_autoconsumo_fv') | float(0) %}
          {% else %}
            {% set fv = 0 %}
          {% endif %}

          {# 3. Se Batteria ON, aggiungo i kWh della batteria, altrimenti 0 #}
          {% if is_state('input_boolean.frarik_bolletta_ha_batteria', 'on') %}
            {% set batt = states('input_number.frarik_bolletta_autoconsumo_batt') | float(0) %}
          {% else %}
            {% set batt = 0 %}
          {% endif %}

          {# SOMMA TOTALE #}
          {{ (rete + fv + batt) | round(1) }}

      # 7. COSTO GIORNALIERO STIMATO
      - name: "Frarik Bolletta Costo Giornaliero"
        unique_id: frarik_bolletta_costo_giornaliero
        unit_of_measurement: "€"
        state: >
          {% set kwh_oggi = states('sensor.frarik_bolletta_consumo_giornaliero') | float(0) %}
          {% set prezzo = states('sensor.frarik_bolletta_prezzo_unico_variabile') | float(0) %}
          {{ (kwh_oggi * prezzo) | round(2) }}

      # 8. MEDIA GIORNALIERA SETTIMANA CORRENTE (kWh)
      - name: "Frarik Bolletta Media Settimanale kWh"
        unique_id: frarik_bolletta_media_settimanale_kwh
        unit_of_measurement: "kWh"
        icon: mdi:chart-timeline-variant
        state: >
          {% set storico =
            states('input_number.frarik_bolletta_lunedi_kwh')|float(0) +
            states('input_number.frarik_bolletta_martedi_kwh')|float(0) +
            states('input_number.frarik_bolletta_mercoledi_kwh')|float(0) +
            states('input_number.frarik_bolletta_giovedi_kwh')|float(0) +
            states('input_number.frarik_bolletta_venerdi_kwh')|float(0) +
            states('input_number.frarik_bolletta_sabato_kwh')|float(0) +
            states('input_number.frarik_bolletta_domenica_kwh')|float(0)
          %}
          {% set oggi = states('sensor.frarik_bolletta_consumo_giornaliero')|float(0) %}
          {% set giorni_trascorsi = now().weekday() + 1 %}
          {{ ((storico + oggi) / giorni_trascorsi) | round(2) }}

      # 9. MEDIA GIORNALIERA SETTIMANA CORRENTE (Euro)
      - name: "Frarik Bolletta Media Settimanale Euro"
        unique_id: frarik_bolletta_media_settimanale_eur
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: >
          {% set storico_eur =
            states('input_number.frarik_bolletta_lunedi_eur')|float(0) +
            states('input_number.frarik_bolletta_martedi_eur')|float(0) +
            states('input_number.frarik_bolletta_mercoledi_eur')|float(0) +
            states('input_number.frarik_bolletta_giovedi_eur')|float(0) +
            states('input_number.frarik_bolletta_venerdi_eur')|float(0) +
            states('input_number.frarik_bolletta_sabato_eur')|float(0) +
            states('input_number.frarik_bolletta_domenica_eur')|float(0)
          %}
          {% set oggi_eur = states('sensor.frarik_bolletta_costo_giornaliero')|float(0) %}
          {% set giorni_trascorsi = now().weekday() + 1 %}
          {{ ((storico_eur + oggi_eur) / giorni_trascorsi) | round(2) }}

