automation:
  - alias: "Frarik Bolletta: Salva Anno Precedente"
    trigger:
      - platform: time
        at: "23:59:50"
    condition:
      - condition: template
        value_template: "{{ now().month == 12 and now().day == 31 }}"
    action:
      # Gennaio
      - service: input_number.set_value
        target: { entity_id: input_number.frarik_bolletta_storico_prec_gennaio_kwh }
