        icon: mdi:transmission-tower
      - name: frarik_bolletta_arera_dispbt
        unique_id: frarik_bolletta_arera_dispbt
        value_template: "{{ value_json.materia_energia.dispbt }}"
        unit_of_measurement: "€/mese"
