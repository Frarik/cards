# ==============================================================================
  # AUTOMAZIONE SALVATAGGIO GIORNALIERO (LUN-DOM)
  # ==============================================================================
  - alias: "Frarik Bolletta - Salva Dati Giornalieri Settimana"
    id: frarik_bolletta_salva_dati_settimana
    trigger:
      - platform: time
        at: "23:59:55"
    action:
      - variables:
          kwh_oggi: "{{ states('sensor.frarik_bolletta_consumo_giornaliero') | float(0) }}"
          eur_oggi: "{{ states('sensor.frarik_bolletta_costo_giornaliero') | float(0) }}"
          giorno: "{{ now().weekday() }}" # 0=Lun, 1=Mar, ..., 6=Dom

      - choose:
          # LUNEDI (0)
          - conditions: "{{ giorno == 0 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_lunedi_kwh }
                data: { value: "{{ kwh_oggi }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_lunedi_eur }
                data: { value: "{{ eur_oggi }}" }

          # MARTEDI (1)
          - conditions: "{{ giorno == 1 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_martedi_kwh }
                data: { value: "{{ kwh_oggi }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_martedi_eur }
                data: { value: "{{ eur_oggi }}" }

          # MERCOLEDI (2)
          - conditions: "{{ giorno == 2 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_mercoledi_kwh }
                data: { value: "{{ kwh_oggi }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_mercoledi_eur }
                data: { value: "{{ eur_oggi }}" }

          # GIOVEDI (3)
          - conditions: "{{ giorno == 3 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_giovedi_kwh }
                data: { value: "{{ kwh_oggi }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_giovedi_eur }
                data: { value: "{{ eur_oggi }}" }

          # VENERDI (4)
          - conditions: "{{ giorno == 4 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_venerdi_kwh }
                data: { value: "{{ kwh_oggi }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_venerdi_eur }
                data: { value: "{{ eur_oggi }}" }

          # SABATO (5)
          - conditions: "{{ giorno == 5 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_sabato_kwh }
                data: { value: "{{ kwh_oggi }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_sabato_eur }
                data: { value: "{{ eur_oggi }}" }

          # DOMENICA (6)
          - conditions: "{{ giorno == 6 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_domenica_kwh }
                data: { value: "{{ kwh_oggi }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.frarik_bolletta_domenica_eur }
                data: { value: "{{ eur_oggi }}" }

# ==============================================================================
  # AUTOMAZIONE 1: ALLARME SOVRACCARICO
  # ==============================================================================
  - alias: "Frarik Bolletta - Allarme Superamento Soglia"
    id: frarik_bolletta_allarme_soglia
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.IL_TUO_SENSORE_POTENZA_CASA
        above: input_number.frarik_bolletta_soglia_power
        for:
          seconds: "{{ states('input_number.frarik_bolletta_ritardo_soglia') | int(10) }}"
    condition:
      - condition: state
        entity_id: input_boolean.frarik_bolletta_notify_overload
        state: 'on'
    action:
      - parallel:
          # --- NOTIFICA CELLULARE ---
          - if:
              - condition: state
                entity_id: input_boolean.frarik_bolletta_notify_push_active
                state: 'on'
            then:
              - service: notify.IL_TUO_MOBILE_APP
                data:
                  title: "⚠️ SOVRACCARICO ELETTRICO"
                  message: "Consumo: {{ states('sensor.IL_TUO_SENSORE_POTENZA_CASA') }} W. Riduci il carico!"
                  data:
                    push: { sound: { name: default, critical: 1, volume: 1.0 } }

          # --- NOTIFICA ALEXA ---
          - if:
              - condition: state
                entity_id: input_boolean.frarik_bolletta_notify_alexa_active
                state: 'on'
            then:
              - service: notify.alexa_media
                data:
                  target:
                    - media_player.IL_TUO_ALEXA
                  message: >
                    Attenzione! Il consumo è {{ states('sensor.IL_TUO_SENSORE_POTENZA_CASA') }} Watt.
                    Stacca subito qualcosa.
                  data:
                    type: announce
                    method: spoken

# ==============================================================================
  # AUTOMAZIONE 2: REPORT CONSUMI (GIORNALIERO, MENSILE, ANNUALE)
  # ==============================================================================
  - alias: "Frarik Bolletta - Report Consumi Serale"
    id: frarik_bolletta_report_consumi
    trigger:
      - platform: time
        at: "23:59:59"
    action:
      # --- 1. REPORT GIORNALIERO ---
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.frarik_bolletta_notify_daily
                state: 'on'
            sequence:
              - service: notify.IL_TUO_MOBILE_APP
                data:
                  title: "⚡ Report Giornaliero"
                  message: >
                    Oggi {{ now().strftime('%d/%m/%Y') }}:
                    Hai consumato: {{ states('sensor.frarik_bolletta_consumo_giornaliero') }} kWh
                    Costo stimato: {{ states('sensor.frarik_bolletta_costo_giornaliero') }} €

      # --- 2. REPORT MENSILE ---
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (now() + timedelta(days=1)).day == 1 }}"
              - condition: state
                entity_id: input_boolean.frarik_bolletta_notify_monthly
                state: 'on'
            sequence:
              - service: notify.IL_TUO_MOBILE_APP
                data:
                  title: "📅 Report Mensile Concluso"
                  message: >
                    Mese di {{ ['','Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'][now().month] }}:
                    Consumo Totale: {{ states('sensor.frarik_bolletta_consumo_mensile') }} kWh
                    Bolletta Stimata: {{ states('sensor.frarik_bolletta_mese_corrente') }} €

      # --- 3. REPORT ANNUALE ---
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ now().day == 31 and now().month == 12 }}"
              - condition: state
                entity_id: input_boolean.frarik_bolletta_notify_yearly
                state: 'on'
            sequence:
              - service: notify.IL_TUO_MOBILE_APP
                data:
                  title: "🎉 Report Annuale {{ now().year }}"
                  message: >
                    Consumo Totale Anno: {{ states('sensor.frarik_bolletta_consumo_annuale') }} kWh
                    (Costo basato sullo storico: {{ states('sensor.frarik_bolletta_totale_anno_euro') }} €)

# ==============================================================================
# 7. SCRIPT
# ==============================================================================
script:
  frarik_bolletta_reset_valori_contratto:
    alias: "Frarik Bolletta - Reset Valori Contratto"
    icon: mdi:refresh-circle
    description: "Reimposta tutti i parametri ai valori ufficiali del contratto"
    mode: single
    sequence:
      # --- BONUS ---
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_bonus_bolletta
        data:
          value: 0.00

      # --- PREZZI ENERGIA ---
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_prezzo_energia_base
        data:
          value: 0.090000
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_prezzo_dispacciamento
        data:
          value: 0.009800
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_prezzo_mercato_capacita
        data:
          value: 0.004275

      # --- PERDITE ---
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_fattore_perdite
        data:
          value: 1.103261

      # --- SPESE VARIABILI ---
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_prezzo_trasporto_energia
        data:
          value: 0.011890
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_prezzo_oneri_sistema
        data:
          value: 0.031322
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_prezzo_uc3_uc6
        data:
          value: 0.001630
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_prezzo_accise
        data:
          value: 0.022700

      # --- QUOTE FISSE ---
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_quota_comm_vendita
        data:
          value: 6.102592
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_quota_trasporto_fisso
        data:
          value: 1.90

      # --- POTENZA ---
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_potenza_impegnata
        data:
          value: 4.5
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_prezzo_quota_potenza
        data:
          value: 2.106567

      # --- ALTRO ---
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_iva_perc
        data:
          value: 10
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_canone_rai
        data:
          value: 9.00

      # --- RESET SIMULATORE ---
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_test_kwh
        data:
          value: 0
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.frarik_bolletta_include_canone

      # --- RESET FOTOVOLTAICO ---
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.frarik_bolletta_ha_fotovoltaico
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.frarik_bolletta_ha_batteria
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_autoconsumo_fv
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.frarik_bolletta_autoconsumo_batt
        data:
          value: 0

