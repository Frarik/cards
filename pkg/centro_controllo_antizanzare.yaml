            0
          {% endif %}

      # Sensore timer ciclo automatico percentuale (decresce da 100 a 0)
      - name: "Anti Zanzare Timer Ciclo Percentage"
        unique_id: anti_zanzare_timer_ciclo_percentage
        unit_of_measurement: "%"
        icon: mdi:timer
        state: >-
          {% if is_state('timer.anti_zanzare_ciclo_timer', 'active') %}
            {% set remaining = state_attr('timer.anti_zanzare_ciclo_timer', 'remaining') %}
            {% set duration = state_attr('timer.anti_zanzare_ciclo_timer', 'duration') %}
            {% if remaining and duration %}
              {% set rem_seconds = remaining.split(':')[0]|int * 3600 + remaining.split(':')[1]|int * 60 + remaining.split(':')[2]|int %}
              {% set dur_seconds = duration.split(':')[0]|int * 3600 + duration.split(':')[1]|int * 60 + duration.split(':')[2]|int %}
              {% if dur_seconds > 0 %}
                {{ (rem_seconds / dur_seconds * 100) | round(1) }}
              {% else %}
                0
              {% endif %}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}

      # Sensore probabilità pioggia (collegato a sensore meteo reale)
      - name: "Probabilità Pioggia"
        unique_id: anti_zanzare_probabilita_pioggia
        state: "{{ states('sensor.openmeteo_precipitation_probability') | int(0) }}"
        unit_of_measurement: "%"
        icon: mdi:weather-rainy

      # Sensore cicli rimanenti mensili
      - name: "Cicli Rimanenti Questo Mese"
        unique_id: anti_zanzare_cicli_rimanenti_mensili
        state: >
          {% set target = states('input_number.anti_zanzare_cicli_target_mensili') | int(0) %}
          {% set completati = states('counter.anti_zanzare_cicli_mensili') | int(0) %}
          {% set rimanenti = target - completati %}
          {{ [0, rimanenti] | max }}
        unit_of_measurement: "cicli"
        icon: mdi:counter-outline
        attributes:
          cicli_target: "{{ states('input_number.anti_zanzare_cicli_target_mensili') | int(0) }}"
          cicli_completati: "{{ states('counter.anti_zanzare_cicli_mensili') | int(0) }}"
          percentuale_completamento: >
            {% set target = states('input_number.anti_zanzare_cicli_target_mensili') | int(1) %}
            {% set completati = states('counter.anti_zanzare_cicli_mensili') | int(0) %}
            {% if target > 0 %}
              {{ ((completati / target) * 100) | round(1) }}
            {% else %}
              0
            {% endif %}

      # Sensore avanzamento mensile
      - name: "Avanzamento Cicli Mensile"
        unique_id: anti_zanzare_avanzamento_mensile
        state: >
          {% set target = states('input_number.anti_zanzare_cicli_target_mensili') | int(1) %}
          {% set completati = states('counter.anti_zanzare_cicli_mensili') | int(0) %}
          {% if completati >= target %}
            Obiettivo Raggiunto!
          {% else %}
            {{ completati }} / {{ target }} cicli
          {% endif %}
        icon: >
          {% set target = states('input_number.anti_zanzare_cicli_target_mensili') | int(1) %}
          {% set completati = states('counter.anti_zanzare_cicli_mensili') | int(0) %}
          {% if completati >= target %}
            mdi:check-circle
          {% elif completati >= target * 0.8 %}
            mdi:progress-check
          {% elif completati >= target * 0.5 %}
            mdi:progress-clock
          {% else %}
            mdi:progress-alert
          {% endif %}
        attributes:
          percentuale: >
            {% set target = states('input_number.anti_zanzare_cicli_target_mensili') | int(1) %}
            {% set completati = states('counter.anti_zanzare_cicli_mensili') | int(0) %}
            {{ ((completati / target) * 100) | round(1) }}
          giorni_rimasti_nel_mese: >
            {% set oggi = now() %}
            {% set prossimo_mese = oggi.replace(day=28) + timedelta(days=4) %}
            {% set ultimo_giorno_mese = (prossimo_mese - timedelta(days=prossimo_mese.day)).day %}
            {{ ultimo_giorno_mese - oggi.day + 1 }}
          media_cicli_giornalieri_necessaria: >
            {% set target = states('input_number.anti_zanzare_cicli_target_mensili') | int(1) %}
            {% set completati = states('counter.anti_zanzare_cicli_mensili') | int(0) %}
            {% set rimanenti = target - completati %}
            {% set oggi = now() %}
            {% set prossimo_mese = oggi.replace(day=28) + timedelta(days=4) %}
            {% set ultimo_giorno_mese = (prossimo_mese - timedelta(days=prossimo_mese.day)).day %}
            {% set giorni_rimasti = ultimo_giorno_mese - oggi.day + 1 %}
            {% if giorni_rimasti > 0 and rimanenti > 0 %}
              {{ (rimanenti / giorni_rimasti) | round(1) }}
            {% else %}
              0
            {% endif %}

  - binary_sensor:
      # Sensore pioggia in corso (collegato a sensore meteo reale)
      - name: "Pioggia in Corso"
        unique_id: anti_zanzare_pioggia_corso
        state: "{{ states('binary_sensor.sensore_pioggia') }}"
        icon: >
          {{ 'mdi:weather-rainy' if is_state('binary_sensor.pioggia_in_corso', 'on') else 'mdi:weather-cloudy' }}

      # Sensore blocco per condizioni meteo
      - name: "Blocco Meteo Attivo"
        unique_id: anti_zanzare_blocco_meteo
        state: >
          {{ is_state('binary_sensor.sensore_pioggia', 'on') or 
             states('sensor.openmeteo_precipitation_probability') | float(0) >= states('input_number.anti_zanzare_soglia_pioggia') | float(0) }}
        icon: >
          {{ 'mdi:weather-rainy' if is_state('binary_sensor.blocco_meteo_attivo', 'on') else 'mdi:weather-partly-cloudy' }}



# AUTOMAZIONI
automation:
  # Reset contatori il primo del mese
  - id: anti_zanzare_reset_contatori
    alias: "Anti Zanzare - Reset Contatori Mensili"
    trigger:
    action:
      - service: counter.reset
        target:
          entity_id: counter.anti_zanzare_cicli_mensili
      - service: counter.set_value
        target:
          entity_id: counter.anti_zanzare_cicli_rimanenti
        data:
          value: "{{ states('input_number.anti_zanzare_cicli_target_mensili') | int }}"

  # Inizializza counter rimanenti quando cambia il target
  - id: anti_zanzare_inizializza_counter_rimanenti
    alias: "Anti Zanzare - Inizializza Counter Rimanenti"
    trigger:
      - platform: state
        entity_id: input_number.anti_zanzare_cicli_target_mensili
    action:
      - service: counter.set_value
        target:
          entity_id: counter.anti_zanzare_cicli_rimanenti
        data:
          value: >
            {% set target = trigger.to_state.state | int %}
            {% set completati = states('counter.anti_zanzare_cicli_mensili') | int(0) %}
            {% set rimanenti = target - completati %}
            {{ [0, rimanenti] | max }}

  # Inizializza counter rimanenti all'avvio di Home Assistant
  - id: anti_zanzare_inizializza_counter_avvio
    alias: "Anti Zanzare - Inizializza Counter all'Avvio"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:30"  # Aspetta che tutte le entità siano caricate
      - service: counter.set_value
        target:
          entity_id: counter.anti_zanzare_cicli_rimanenti
        data:
          value: >
            {% set target = states('input_number.anti_zanzare_cicli_target_mensili') | int %}
            {% set completati = states('counter.anti_zanzare_cicli_mensili') | int(0) %}
            {% set rimanenti = target - completati %}
            {{ [0, rimanenti] | max }}

  # Avvio automazione
  - id: anti_zanzare_avvio_automazione
    alias: "Anti Zanzare - Avvio Automazione"
    trigger:
      - platform: state
        entity_id: input_button.anti_zanzare_start_automazione
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.anti_zanzare_automazione_attiva

  # Stop automazione
  - id: anti_zanzare_stop_automazione
    alias: "Anti Zanzare - Stop Automazione"
    trigger:
      - platform: state
        entity_id: input_button.anti_zanzare_stop_automazione
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.anti_zanzare_automazione_attiva
      - service: timer.cancel
        target:
          entity_id: timer.anti_zanzare_ciclo_timer

  # SISTEMA SEMPLICE - FUNZIONA DAVVERO!
  # Automazioni dirette per ogni giorno - LUNEDÌ
  - id: anti_zanzare_lunedi_ciclo1
    alias: "Anti Zanzare - Lunedì Ciclo 1"
    trigger:
    condition:
      - condition: time
        weekday: mon
      - condition: state
        entity_id: input_boolean.anti_zanzare_lunedi
        state: "on"
      - condition: state
        entity_id: input_boolean.anti_zanzare_automazione_attiva
        state: "on"
      - condition: state
        entity_id: binary_sensor.blocco_meteo_attivo
        state: "off"
      - condition: not
        conditions:
          - condition: state
            entity_id: timer.anti_zanzare_ciclo_timer
            state: "active"
      - condition: template
        value_template: "{{ states('input_number.anti_zanzare_lunedi_num_cicli') | int >= 1 }}"
    action:
      - service: timer.start
        target:
          entity_id: timer.anti_zanzare_ciclo_timer
        data:
          duration: "{{ states('input_number.anti_zanzare_lunedi_durata_ciclo1') | int(0) }}"
      - service: counter.increment
        target:
          entity_id: counter.anti_zanzare_cicli_mensili
      - service: counter.decrement
        target:
          entity_id: counter.anti_zanzare_cicli_rimanenti
      - service: switch.turn_on
        target:
          entity_id: switch.presa_anti_zanzare

