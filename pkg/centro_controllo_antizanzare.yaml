        to: 'active'
    action:
      - service: notify.mobile_app_iphone_di_francesco
        data:
          message: "🦟 Ciclo Anti Zanzare Automatico Avviato. 🦟"
          title: "🦟 Anti Zanzare 🦟 "

  - alias: Notifica fine ciclo automatico anti_zanzare
    trigger:
      - platform: state
        entity_id: timer.anti_zanzare_ciclo_timer
