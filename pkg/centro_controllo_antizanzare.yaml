  # SISTEMA COMPLETATO - FUNZIONA!

  # Stop anti_zanzare automatica quando timer finisce
  - id: anti_zanzare_stop_automatica
    alias: "Anti Zanzare - Stop Automatica"
    trigger:
      - platform: state
        entity_id: timer.anti_zanzare_ciclo_timer
        from: "active"
        to: "idle"
    condition:
      - condition: state
        entity_id: input_boolean.anti_zanzare_manuale_attiva
        state: "off"
    action:
      # Disattiva pompa reale
      - service: switch.turn_off
        target:
          entity_id: switch.presa_anti_zanzare
      - service: timer.cancel
        target:
          entity_id: timer.anti_zanzare_ciclo_timer

  # Blocco per pioggia e soglia probabilità
  - id: anti_zanzare_blocco_meteo
    alias: "Anti Zanzare - Blocco per Condizioni Meteo"
    trigger:
      - platform: state
        entity_id: binary_sensor.blocco_meteo_attivo
        to: "on"
    action:
      - service: timer.cancel
        target:
          entity_id: timer.anti_zanzare_ciclo_timer
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.anti_zanzare_manuale_attiva
      # Disattivare pompa (TEMPORANEO: sostituire con switch reale)
      - service: switch.turn_off
        target:
          entity_id: switch.presa_anti_zanzare

  # Disattivazione automazione per condizioni meteo
  - id: anti_zanzare_disattiva_automazione_meteo
    alias: "Anti Zanzare - Disattiva Automazione per Meteo"
    trigger:
      - platform: state
        entity_id: binary_sensor.blocco_meteo_attivo
        to: "on"
        for: "00:00:01"
    condition:
      - condition: state
        entity_id: input_boolean.anti_zanzare_automazione_attiva
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.anti_zanzare_automazione_attiva
          
  # Riattivazione automazione per condizioni meteo migliorate           
  - id: anti_zanzare_riattiva_automazione_meteo
    alias: "Anti Zanzare - Riattiva Automazione per Meteo"
    trigger:
      - platform: state
        entity_id: binary_sensor.blocco_meteo_attivo
        to: "off"
        for: "00:01:00"  # Aspetta 1 minuti prima di riattivare automazione
    condition:
      - condition: state
        entity_id: input_boolean.anti_zanzare_automazione_attiva
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.anti_zanzare_automazione_attiva          
          

  # Avvio anti_zanzare manuale
  - id: anti_zanzare_avvio_manuale
    alias: "Anti Zanzare - Avvio Manuale"
    trigger:
      - platform: state
        entity_id: input_boolean.anti_zanzare_manuale_attiva
        to: "on"
    action:
      # Ferma automazione se attiva
      - service: timer.cancel
        target:
          entity_id: timer.anti_zanzare_ciclo_timer
      # Avvia timer manuale con durata impostata
      - service: timer.start
        target:
          entity_id: timer.anti_zanzare_manuale_timer
        data:
          duration: >
            {{ '00:%02d:%02d' | format((states('input_number.anti_zanzare_durata_manuale') | int // 60), (states('input_number.anti_zanzare_durata_manuale') | int % 60)) }}
      # Attiva pompa reale
      - service: switch.turn_on
        target:
          entity_id: switch.presa_anti_zanzare
      # Incrementa contatore mensile
      - service: counter.increment
        target:
          entity_id: counter.anti_zanzare_cicli_mensili
      # Decrementa contatore rimanenti
      - service: counter.decrement
        target:
          entity_id: counter.anti_zanzare_cicli_rimanenti

  # Avvio manuale da pulsante (imposta il boolean e quindi scatena l'automazione esistente)
  - id: anti_zanzare_avvio_manuale_button
    alias: "Anti Zanzare - Avvio Manuale (Button)"
    trigger:
      - platform: state
        entity_id: input_button.anti_zanzare_start_manuale
    condition: []
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.anti_zanzare_manuale_attiva
    mode: single

  # Stop manuale da pulsante (spegne tutto e cancella timer)
  - id: anti_zanzare_stop_manuale_button
    alias: "Anti Zanzare - Stop Manuale (Button)"
    trigger:
      - platform: state
        entity_id: input_button.anti_zanzare_stop_manuale
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.anti_zanzare_manuale_attiva
      - service: timer.cancel
        target:
          entity_id: timer.anti_zanzare_manuale_timer
      # Spegne pompa (sostituire con switch reale se necessario)
      - service: switch.turn_off
        target:
          entity_id: switch.presa_anti_zanzare
    mode: restart

  # Fine anti_zanzare manuale - Timer finito
  - id: anti_zanzare_fine_timer_manuale
    alias: "Anti Zanzare - Fine Timer Manuale"
    trigger:
      - platform: state
        entity_id: timer.anti_zanzare_manuale_timer
        from: "active"
        to: "idle"
    condition:
      - condition: state
        entity_id: input_boolean.anti_zanzare_manuale_attiva
        state: "on"
    action:
      # Spegni pompa reale
      - service: switch.turn_off
        target:
          entity_id: switch.presa_anti_zanzare
      # Disattiva boolean manuale
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.anti_zanzare_manuale_attiva

  # Stop manuale - Interruzione timer
  - id: anti_zanzare_stop_manuale_forzato
    alias: "Anti Zanzare - Stop Manuale Forzato"
    trigger:
      - platform: state
        entity_id: input_boolean.anti_zanzare_manuale_attiva
        to: "off"
    condition:
      - condition: state
        entity_id: timer.anti_zanzare_manuale_timer
        state: "active"
    action:
      # Ferma timer manuale
      - service: timer.cancel
        target:
          entity_id: timer.anti_zanzare_manuale_timer
      # Spegni pompa
      - service: switch.turn_off
        target:
          entity_id: switch.presa_anti_zanzare

####automazioni###
  # Automazioni di notifica anti_zanzare
  - alias: Notifica inizio ciclo automatico anti_zanzare
