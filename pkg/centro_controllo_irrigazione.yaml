# INPUT BUTTON - Comandi
input_button:
  irrigazione_start_automazione:
    name: "Avvia Automazione Irrigazione"
    icon: mdi:play-circle
  irrigazione_stop_automazione:
    name: "Ferma Automazione Irrigazione"
    icon: mdi:stop-circle
  irrigazione_start_manuale:
    name: "Avvia Irrigazione Manuale"
    icon: mdi:play-circle-outline
  irrigazione_stop_manuale:
    name: "Ferma Irrigazione Manuale"
    icon: mdi:stop-circle-outline

# TIMER
timer:
  irrigazione_ciclo_timer:
    name: "Timer Ciclo Irrigazione"
    icon: mdi:clock
    restore: true
  irrigazione_manuale_timer:
    name: "Timer Irrigazione Manuale"
    icon: mdi:hand-back-right
    restore: true

# COUNTER
counter:
  irrigazione_cicli_giornalieri:
    name: "Cicli Irrigazione Oggi"
    step: 1
    icon: mdi:counter

# SENSORI TEMPLATE
template:
  - sensor:
      - name: "Stato Irrigazione"
        unique_id: irrigazione_stato_sistema
        state: >
          {% if is_state('input_boolean.irrigazione_manuale_attiva', 'on') %}
            Manuale Attiva
          {% elif is_state('timer.irrigazione_ciclo_timer', 'active') %}
            Ciclo in Corso
          {% elif is_state('input_boolean.irrigazione_automazione_attiva', 'on') %}
            Automazione Attiva
          {% else %}
            Spenta
          {% endif %}
        icon: >
          {% if is_state('input_boolean.irrigazione_manuale_attiva', 'on') %}
            mdi:hand-back-right
          {% elif is_state('timer.irrigazione_ciclo_timer', 'active') %}
            mdi:sprinkler
          {% elif is_state('input_boolean.irrigazione_automazione_attiva', 'on') %}
            mdi:autorenew
          {% else %}
            mdi:sprinkler-variant-off
          {% endif %}

  - binary_sensor:
      - name: "Blocco Meteo Irrigazione"
        unique_id: irrigazione_blocco_meteo
        state: >
          {{ states('sensor.probabilita_pioggia') | float(0) >= states('input_number.irrigazione_soglia_pioggia') | float(50) or
             is_state('binary_sensor.pioggia_in_corso', 'on') }}
        icon: >
          {{ 'mdi:weather-rainy' if is_state('binary_sensor.blocco_meteo_irrigazione', 'on') else 'mdi:weather-partly-cloudy' }}

# AUTOMAZIONI BASE
automation:
  - id: irrigazione_avvio_automazione
    alias: "Irrigazione - Avvio Automazione"
    trigger:
      - platform: state
        entity_id: input_button.irrigazione_start_automazione
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.irrigazione_automazione_attiva

  - id: irrigazione_stop_automazione_handler
    alias: "Irrigazione - Stop Automazione"
    trigger:
      - platform: state
        entity_id: input_button.irrigazione_stop_automazione
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigazione_automazione_attiva
      - service: timer.cancel
        target:
          entity_id: timer.irrigazione_ciclo_timer

  - id: irrigazione_avvio_manuale
    alias: "Irrigazione - Avvio Manuale"
    trigger:
      - platform: state
        entity_id: input_button.irrigazione_start_manuale
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.irrigazione_manuale_attiva
      - service: timer.start
        target:
          entity_id: timer.irrigazione_manuale_timer
        data:
          duration: "{{ states('input_number.irrigazione_durata_manuale') | int(60) }}"
      # Attiva il rubinetto
      - service: switch.turn_on
        target:
          entity_id: switch.rubinetto_esterno_interruttore

  - id: irrigazione_stop_manuale
    alias: "Irrigazione - Stop Manuale"
    trigger:
      - platform: state
        entity_id: input_button.irrigazione_stop_manuale
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigazione_manuale_attiva
      - service: timer.cancel
        target:
          entity_id: timer.irrigazione_manuale_timer
      - service: switch.turn_off
        target:
          entity_id: switch.rubinetto_esterno_interruttore

  - id: irrigazione_timer_ciclo_finito
    alias: "Irrigazione - Timer Ciclo Finito"
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.irrigazione_ciclo_timer
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.rubinetto_esterno_interruttore

  - id: irrigazione_timer_manuale_finito
    alias: "Irrigazione - Timer Manuale Finito"
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.irrigazione_manuale_timer
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigazione_manuale_attiva
      - service: switch.turn_off
        target:
          entity_id: switch.rubinetto_esterno_interruttore

  - id: irrigazione_reset_cicli_giornalieri
    alias: "Irrigazione - Reset Cicli Giornalieri"
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: counter.reset
        target:
          entity_id: counter.irrigazione_cicli_giornalieri
