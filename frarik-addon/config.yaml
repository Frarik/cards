name: "Frarik Dashboard"
description: "Dashboard personalizzata per Home Assistant — sviluppata da Fratech & Rizzahc"
version: "1.6.01"
slug: frarik_dashboard
url: "https://github.com/Frarik/cards"

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

startup: application
boot: auto

ingress: true
ingress_port: 3000
ingress_stream: false

panel_icon: mdi:view-dashboard
panel_title: Frarik

homeassistant_api: true
auth_api: false
hassio_api: true
hassio_role: default

map:
  - config:rw

apparmor: false
