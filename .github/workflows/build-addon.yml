name: Build & Release Frarik Add-on

on:
  push:
    branches: [main]
    paths:
      - 'frarik-addon/**'
      - '.github/workflows/build-addon.yml'
  workflow_dispatch: {}

concurrency:
  group: build-addon
  cancel-in-progress: true

# NB: il build vero dell'add-on avviene via Docker quando Home Assistant lo
# (re)installa (Dockerfile → npm run build). Questo workflow si limita a
# notificare le istanze HA dopo un push. Niente checkout/jq/commit: evita i
# fallimenti (exit code 2 su panel/manifest.json, che nessuno usa) e la
# deprecazione di actions/checkout@v4 su Node 20.

jobs:
  notify-ha:
    runs-on: ubuntu-latest
    steps:
      - name: Notifica HA Frarik (Fratech)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://cvkvlnpaokb2r0pedlqjlq06f5zsd3fl.ui.nabu.casa/api/services/homeassistant/reload_custom_templates" \
              -H "Authorization: Bearer ${{ secrets.HA_TOKEN_FRARIK }}" \
              -H "Content-Type: application/json" -d '{}')
            echo "Tentativo $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break || sleep 10
          done

      - name: Notifica HA Rizzahc (amico)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://mzlej5bjgutlujw3go5vsanafnf1bom1.ui.nabu.casa/api/services/homeassistant/reload_custom_templates" \
              -H "Authorization: Bearer ${{ secrets.HA_TOKEN_FRAZIC95 }}" \
              -H "Content-Type: application/json" -d '{}')
            echo "Tentativo $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break || sleep 10
          done
