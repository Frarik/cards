name: Deploy frarik.html su Home Assistant

on:
  push:
    branches:
      - main
    paths:
      - 'frarik.html'

concurrency:
  group: deploy-frarik
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Aspetta che GitHub aggiorni la CDN ──
      - name: Attendi propagazione CDN
        run: sleep 30

      # ── Aggiorna HA Frarik (3 tentativi) ──
      - name: Aggiorna HA Frarik
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://cvkvlnpaokb2r0pedlqjlq06f5zsd3fl.ui.nabu.casa/api/services/shell_command/aggiorna_frarik" \
              -H "Authorization: Bearer ${{ secrets.HA_TOKEN_FRARIK }}" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Tentativo $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "OK - HA Frarik aggiornato"
              break
            fi
            echo "Riprovo tra 10 secondi..."
            sleep 10
          done

      # ── Aspetta che HA Frarik finisca di scrivere il file ──
      - name: Pausa tra i due deploy
        run: sleep 10

      # ── Aggiorna HA Frazic95 (3 tentativi) ──
      - name: Aggiorna HA Frazic95
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://mzlej5bjgutlujw3go5vsanafnf1bom1.ui.nabu.casa/api/services/shell_command/aggiorna_frarik" \
              -H "Authorization: Bearer ${{ secrets.HA_TOKEN_FRAZIC95 }}" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Tentativo $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "OK - HA Frazic95 aggiornato"
              break
            fi
            echo "Riprovo tra 10 secondi..."
            sleep 10
          done
